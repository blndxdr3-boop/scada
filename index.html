<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سیستەمی زیرەکی کێڵگەکانی پەلەوەر | SCADA HMI</title>
  <!-- فۆنتی فەرمی و جوانی کوردی Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #060b16;
      --bg-surface: rgba(15, 23, 42, 0.78);
      --bg-card: rgba(30, 41, 59, 0.65);
      --bg-card-hover: rgba(38, 53, 77, 0.85);
      --border: rgba(148, 163, 184, 0.16);
      --border-highlight: rgba(56, 189, 248, 0.45);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #0ea5e9;
      --primary-glow: rgba(14, 165, 233, 0.35);
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.4);
      --danger: #f43f5e;
      --danger-glow: rgba(244, 63, 94, 0.5);
      --amber: #f59e0b;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 10% 10%, rgba(14, 165, 233, 0.15) 0px, transparent 45%),
        radial-gradient(at 90% 20%, rgba(16, 185, 129, 0.10) 0px, transparent 45%),
        radial-gradient(at 50% 90%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 36px 36px, 36px 36px;
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* هێدەری سەرەوە */
    header {
      background: rgba(9, 14, 28, 0.85);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0ea5e9, #10b981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
      flex-shrink: 0;
    }

    .brand h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .brand p {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .alarm-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .alarm-pill.ok {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .alarm-pill.fault {
      background: rgba(244, 63, 94, 0.18);
      border: 1px solid var(--danger);
      color: #fda4af;
      animation: pulseAlarm 1.5s infinite;
    }

    @keyframes pulseAlarm {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.45); }
      50% { box-shadow: 0 0 20px 4px rgba(244, 63, 94, 0.55); }
    }

    /* دوگمەکان */
    .btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.84rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-highlight);
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      border-color: #38bdf8;
      color: #fff;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.25);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1, #0284c7);
    }

    .btn-success {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.45);
      color: #6ee7b7;
    }

    .btn-danger {
      background: rgba(244, 63, 94, 0.15);
      border-color: rgba(244, 63, 94, 0.45);
      color: #fda4af;
    }

    /* گڵۆپی LED */
    .led {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .led.green {
      background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald-glow);
    }

    .led.red {
      background: var(--danger);
      box-shadow: 0 0 12px var(--danger-glow);
      animation: blinkLed 0.75s infinite alternate;
    }

    @keyframes blinkLed {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0.35; transform: scale(1.22); }
    }

    main {
      max-width: 1440px;
      margin: 0 auto;
      padding: 26px 18px 70px;
    }

    /* ئاماری گشتی سەرەوەی هۆم */
    .global-stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-tile {
      background: var(--bg-surface);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(14, 165, 233, 0.12);
      border: 1px solid rgba(14, 165, 233, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .stat-info span {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: block;
    }

    .stat-info strong {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
    }

    /* کارتی پڕۆژەکان لە پەڕەی سەرەکی */
    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-heading h2 {
      font-size: 1.35rem;
      font-weight: 800;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 22px;
    }

    .project-card {
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }

    .project-card:hover {
      transform: translateY(-6px);
      border-color: var(--border-highlight);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.45), 0 0 25px rgba(14, 165, 233, 0.15);
    }

    .project-card.has-fault {
      border-color: rgba(244, 63, 94, 0.55);
      box-shadow: 0 10px 28px rgba(244, 63, 94, 0.15);
    }

    /* نەخشەی 3Dـی هۆڵەکان لەسەر کارتی پڕۆژە */
    .iso-map-box {
      height: 120px;
      background: radial-gradient(circle at center, rgba(14, 165, 233, 0.16) 0%, rgba(6, 11, 22, 0.85) 100%);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 12px;
    }

    .iso-halls-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 240px;
    }

    .mini-hall-bar {
      height: 24px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.22);
      border: 1px solid rgba(16, 185, 129, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: #a7f3d0;
      transition: 0.2s;
    }

    .mini-hall-bar.fault {
      background: rgba(244, 63, 94, 0.35);
      border-color: var(--danger);
      color: #fecdd3;
      animation: blinkLed 0.8s infinite alternate;
    }

    .card-metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .mini-metric {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .mini-metric span {
      color: var(--text-muted);
      font-size: 0.74rem;
    }

    .mini-metric strong {
      color: #fff;
      font-size: 0.9rem;
    }

    /* ناوەوەی پڕۆژە */
    .project-top-bar {
      background: var(--bg-surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 22px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .project-switcher {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .p-switch-btn {
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 700;
      transition: 0.2s;
    }

    .p-switch-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: #38bdf8;
    }

    /* تابە سەرەکییەکانی ناو پڕۆژە */
    .main-tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
      margin-bottom: 22px;
    }

    .main-tab-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 13px 16px;
      border-radius: var(--radius-md);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: 0.2s;
    }

    .main-tab-btn.active {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.25), rgba(2, 132, 199, 0.4));
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 6px 20px rgba(14, 165, 233, 0.2);
    }

    /* شریتی هەڵبژاردنی ١٠ هۆڵەکە */
    .halls-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 8px;
      margin-bottom: 20px;
    }

    .hall-tab {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: 0.2s;
    }

    .hall-tab.active {
      background: rgba(14, 165, 233, 0.2);
      border-color: var(--primary);
      color: #fff;
    }

    .hall-tab.fault {
      border-color: var(--danger);
      background: rgba(244, 63, 94, 0.14);
      color: #fda4af;
    }

    /* هەستەوەرەکانی ژینگەی هۆڵ */
    .env-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .env-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .env-card.alarm {
      border-color: var(--danger);
      background: rgba(244, 63, 94, 0.12);
    }

    .env-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: #38bdf8;
      margin: 2px 0;
    }

    /* فلتەری ئامێرەکانی ناو هۆڵ (بۆ نەهێشتنی قەرەباڵغی) */
    .category-filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 18px;
      scrollbar-width: thin;
    }

    .cat-chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .cat-chip.active {
      background: var(--primary);
      color: #fff;
      border-color: #38bdf8;
    }

    /* گرووپی ئامێرەکان */
    .equip-group-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 18px;
    }

    .equip-group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 10px;
    }

    .devices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
      gap: 12px;
    }

    .device-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: 0.2s;
    }

    .device-card.is-on {
      border-color: rgba(16, 185, 129, 0.35);
    }

    .device-card.is-fault {
      border-color: var(--danger);
      background: rgba(244, 63, 94, 0.12);
    }

    .device-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 0.88rem;
    }

    .device-actions {
      display: flex;
      gap: 6px;
      margin-top: auto;
    }

    .power-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .power-btn.on {
      background: var(--emerald);
      color: #042f2e;
    }

    .power-btn.off {
      background: #334155;
      color: #e2e8f0;
    }

    .sim-fault-btn {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .sim-fault-btn.fix {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    /* سایلۆکان */
    .silos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
      gap: 16px;
    }

    .silo-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      text-align: center;
    }

    .silo-cylinder {
      width: 72px;
      height: 125px;
      margin: 14px auto;
      background: #090f1d;
      border: 2px solid #475569;
      border-radius: 14px 14px 30px 30px;
      position: relative;
      overflow: hidden;
    }

    .silo-level {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(180deg, #fbbf24, #d97706);
      transition: height 0.4s ease;
    }

    .silo-pct-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    /* خشتەی کارمەندان */
    .table-container {
      overflow-x: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 740px;
    }

    th, td {
      padding: 13px 16px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      font-size: 0.86rem;
    }

    th {
      background: rgba(15, 23, 42, 0.9);
      color: #38bdf8;
      font-weight: 800;
    }

    .role-tag {
      padding: 4px 10px;
      border-radius: 50px;
      font-size: 0.76rem;
      font-weight: 700;
      background: rgba(14, 165, 233, 0.14);
      color: #7dd3fc;
      border: 1px solid rgba(14, 165, 233, 0.3);
    }

    .att-chip {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
      margin-left: 4px;
    }

    .att-chip.present.active {
      background: rgba(16, 185, 129, 0.22);
      border-color: var(--emerald);
      color: #6ee7b7;
    }

    .att-chip.absent.active {
      background: rgba(244, 63, 94, 0.22);
      border-color: var(--danger);
      color: #fda4af;
    }

    .att-chip.leave.active {
      background: rgba(245, 158, 11, 0.22);
      border-color: var(--amber);
      color: #fde68a;
    }

    /* مۆداڵ (پەنجەرەی سەر شاشە) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.78);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: #0f172a;
      border: 1px solid var(--border-highlight);
      border-radius: var(--radius-lg);
      max-width: 540px;
      width: 100%;
      padding: 24px;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.65);
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: #fff;
      font-size: 0.92rem;
    }

    @media (max-width: 640px) {
      header { padding: 12px 14px; }
      main { padding: 18px 12px 60px; }
      .brand h1 { font-size: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">🐔</div>
      <div>
        <h1>سیستەمی زیرەکی پڕۆژەکانی دەواجن (SCADA)</h1>
        <p>کۆنتڕۆڵی مەرکەزی ٨ پڕۆژە • ٨٠ هۆڵی ستاندارد • چاودێری ڕاستەوخۆ</p>
      </div>
    </div>

    <div class="header-actions">
      <div id="globalAlarmBanner" class="alarm-pill ok" onclick="openFaultsModal()">
        <span class="led green" id="globalAlarmLed"></span>
        <span id="globalAlarmText">سیستەم بێ کێشەیە (٠ ئەلارم)</span>
      </div>
      <button class="btn" onclick="simulateRandomFault()">⚡ تاقیکردنەوەی ئەلارم</button>
      <button class="btn btn-primary" id="backHomeBtn" style="display:none;" onclick="goHome()">🏠 پەڕەی سەرەکی</button>
    </div>
  </header>

  <main id="appContainer"></main>

  <!-- مۆداڵی دەستکاریکردنی کارمەند -->
  <div class="modal-overlay" id="editStaffModal">
    <div class="modal-card">
      <h3 style="margin-bottom: 16px;">✏️ دەستکاریکردنی زانیاری کارمەند</h3>
      <div class="input-group">
        <label>ناوی سیانی کارمەند:</label>
        <input type="text" id="editStaffName" placeholder="ناوی کارمەند بنووسە..." />
      </div>
      <div class="input-group">
        <label>پلە و بەرپرسیارێتی:</label>
        <input type="text" id="editStaffRole" disabled />
      </div>
      <div class="input-group">
        <label>ژمارەی مۆبایل:</label>
        <input type="text" id="editStaffPhone" placeholder="0750xxxxxxx" />
      </div>
      <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px;">
        <button class="btn" onclick="closeStaffModal()">پاشگەزبوونەوە</button>
        <button class="btn btn-primary" onclick="saveStaffEdit()">پاشەکەوتکردن</button>
      </div>
    </div>
  </div>

  <!-- مۆداڵی لیستی کێشە و ئەلارمەکان -->
  <div class="modal-overlay" id="faultsModal">
    <div class="modal-card" style="max-width: 650px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
        <h3>🚨 لیستی کێشە و ئەلارمەکانی سیستەم</h3>
        <button class="btn btn-success" onclick="fixAllFaults()">✅ چاککردنەوەی هەمووی</button>
      </div>
      <div id="faultsListContainer"></div>
      <div style="display:flex; justify-content:flex-end; margin-top:18px;">
        <button class="btn" onclick="closeFaultsModal()">داخستن</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'POULTRY_SCADA_PRO_V2';

    const FIRST_NAMES = [
      'کاروان', 'بەرهەم', 'سۆران', 'ئارام', 'دیار', 'هەڵۆ', 'ڕێبین', 'شوان',
      'پشتیوان', 'زانا', 'هێمن', 'ئومێد', 'شاهین', 'بەختیار', 'کاردۆ', 'سەنگەر',
      'نەبەز', 'ڕزگار', 'هاوکار', 'دلێر', 'کامەران', 'گۆران', 'سامان', 'یاسین', 'فەرهاد'
    ];
    const LAST_NAMES = [
      'ئەحمەد', 'محەمەد', 'عەلی', 'حەسەن', 'ئیبراهیم', 'مەحموود', 'عوسمان', 'قادر',
      'کەریم', 'سەعید', 'مستەفا', 'عەبدوڵڵا', 'ڕەسووڵ', 'حەمەد', 'ساڵح'
    ];

    function generateStaffForProject(pIndex) {
      const roles = [
        { role: 'ئەندازیاری ئۆتۆمەیشن' },
        { role: 'دکتۆری ڤێتێرنەری پەلەوەر' },
        { role: 'سەرپەرشتیاری گشتی' },
        { role: 'تەکنیککاری کارەبا' },
        { role: 'تەکنیککاری میکانیک' },
        { role: 'پاسەوانی دەرگا' },
        { role: 'چێشتلێنەر' }
      ];
      for (let w = 1; w <= 18; w++) {
        roles.push({ role: `کرێکاری هۆڵ (${w})` });
      }

      return roles.map((r, idx) => {
        const fn = FIRST_NAMES[(idx + pIndex * 3) % FIRST_NAMES.length];
        const ln = LAST_NAMES[(idx * 2 + pIndex) % LAST_NAMES.length];
        return {
          id: `P${pIndex}_S${idx + 1}`,
          name: `${fn} ${ln}`,
          role: r.role,
          phone: `0750 ${110 + pIndex}${210 + idx}`,
          status: 'present'
        };
      });
    }

    function createDevicesList(prefix, label, count, defaultOn = true) {
      const list = [];
      for (let i = 1; i <= count; i++) {
        list.push({
          id: `${prefix}_${i}`,
          name: `${label} (${i})`,
          on: defaultOn,
          fault: false
        });
      }
      return list;
    }

    function createHall(pIdx, hIdx) {
      return {
        id: hIdx,
        name: `هۆڵی ${hIdx}`,
        dimensions: '80m × 20m',
        temp: +(24.5 + (hIdx % 3) * 0.3).toFixed(1),
        n2_ppm: 12 + (hIdx % 5),
        co2_ppm: 1800 + (hIdx * 30),
        alarms: { tempColdHeat: false, n2: false, co2: false },
        silo: {
          capacityTons: 25,
          currentTons: +(18.5 - (hIdx % 5) * 2.1).toFixed(1),
          augerOn: true,
          fault: false
        },
        elecPanels: [
          { id: `P${pIdx}H${hIdx}_PNL_1`, name: 'لوحەی کارەبای سەرەکی (A)', on: true, voltage: '398V', loadAmp: '62A', fault: false },
          { id: `P${pIdx}H${hIdx}_PNL_2`, name: 'لوحەی کارەبای کۆنتڕۆڵ (B)', on: true, voltage: '400V', loadAmp: '45A', fault: false }
        ],
        exhaustFans: createDevicesList(`P${pIdx}H${hIdx}_EXF`, 'ساحیبەی هەوا', 14, true),
        tunnelFans: [
          { id: `P${pIdx}H${hIdx}_TNF_1`, name: 'ساحیبەی تونێلی (ساردی)', on: true, fault: false },
          { id: `P${pIdx}H${hIdx}_TNF_2`, name: 'ساحیبەی تونێلی (گەرمی)', on: false, fault: false }
        ],
        heaters: createDevicesList(`P${pIdx}H${hIdx}_HTR`, 'هیتەری گەرمکەرەوە', 6, false),
        coolingMotors: createDevicesList(`P${pIdx}H${hIdx}_CLM`, 'ماتۆڕی شەلال', 4, true),
        ventWindows: [
          { id: `P${pIdx}H${hIdx}_VNT_R`, name: 'پەنجەرەی تەهویەی ڕاست (80m)', on: true, openPercent: 65, fault: false },
          { id: `P${pIdx}H${hIdx}_VNT_L`, name: 'پەنجەرەی تەهویەی چەپ (80m)', on: true, openPercent: 65, fault: false }
        ],
        feedLines: createDevicesList(`P${pIdx}H${hIdx}_FDL`, 'هێڵی دانخۆری', 6, true),
        lightLines: createDevicesList(`P${pIdx}H${hIdx}_LGT`, 'هێڵی ڕووناکی', 6, true)
      };
    }

    function buildInitialData() {
      const projects = [];
      for (let p = 1; p <= 8; p++) {
        const halls = [];
        for (let h = 1; h <= 10; h++) {
          halls.push(createHall(p, h));
        }
        projects.push({
          id: p,
          name: `پڕۆژەی دەواجنی ژمارە (${p})`,
          sanitationShower: {
            id: `P${p}_SHOWER`,
            name: 'حەمامی تەعقیمی دەرگای سەرەکی',
            on: true,
            disinfectantLevel: 90,
            todayEntries: 22 + p,
            fault: false
          },
          generators: [
            {
              id: `P${p}_GEN_1`,
              name: 'مۆلیدەی سەرەکی (1) - 500 kVA',
              on: true,
              voltage: '400V',
              freq: '50.0 Hz',
              fuelPercent: 85,
              hours: 1350 + p * 12,
              fault: false
            },
            {
              id: `P${p}_GEN_2`,
              name: 'مۆلیدەی یەدەگ (2) - 500 kVA',
              on: false,
              voltage: '0V',
              freq: '0.0 Hz',
              fuelPercent: 96,
              hours: 790 + p * 10,
              fault: false
            }
          ],
          halls,
          staff: generateStaffForProject(p)
        });
      }
      return projects;
    }

    let state = {
      view: 'home',
      selectedProjectId: 1,
      activeTab: 'halls',
      selectedHallId: 1,
      equipmentFilter: 'all', // 'all' | 'elecPanels' | 'exhaustFans' | 'climate' | 'feedLight'
      projects: []
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          state.projects = JSON.parse(saved);
        } else {
          state.projects = buildInitialData();
          saveState();
        }
      } catch (e) {
        state.projects = buildInitialData();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.projects));
      } catch (e) {}
    }

    function getAllFaults() {
      const faults = [];
      state.projects.forEach(p => {
        if (p.sanitationShower.fault) {
          faults.push({ pId: p.id, pName: p.name, location: 'دەرگای سەرەکی', item: p.sanitationShower.name });
        }
        p.generators.forEach(g => {
          if (g.fault) faults.push({ pId: p.id, pName: p.name, location: 'مۆلیدەکان', item: g.name });
        });
        p.halls.forEach(h => {
          if (h.alarms.tempColdHeat) faults.push({ pId: p.id, pName: p.name, hId: h.id, location: h.name, item: 'ئەلارمی پلەی گەرمی هۆڵ' });
          if (h.alarms.n2) faults.push({ pId: p.id, pName: p.name, hId: h.id, location: h.name, item: 'بەرزی ڕێژەی نایترۆجین (N2)' });
          if (h.alarms.co2) faults.push({ pId: p.id, pName: p.name, hId: h.id, location: h.name, item: 'بەرزی گازی CO2' });
          if (h.silo.fault) faults.push({ pId: p.id, pName: p.name, hId: h.id, location: h.name, item: `سایلۆی عەلەفی ${h.name}` });

          [
            h.elecPanels, h.exhaustFans, h.tunnelFans, h.heaters,
            h.coolingMotors, h.ventWindows, h.feedLines, h.lightLines
          ].forEach(grp => grp.forEach(dev => {
            if (dev.fault) faults.push({ pId: p.id, pName: p.name, hId: h.id, location: h.name, item: dev.name });
          }));
        });
      });
      return faults;
    }

    function countHallFaults(h) {
      let c = 0;
      if (h.alarms.tempColdHeat) c++;
      if (h.alarms.n2) c++;
      if (h.alarms.co2) c++;
      if (h.silo.fault) c++;
      [
        h.elecPanels, h.exhaustFans, h.tunnelFans, h.heaters,
        h.coolingMotors, h.ventWindows, h.feedLines, h.lightLines
      ].forEach(grp => grp.forEach(d => { if (d.fault) c++; }));
      return c;
    }

    function countProjectFaults(p) {
      let c = 0;
      if (p.sanitationShower.fault) c++;
      p.generators.forEach(g => { if (g.fault) c++; });
      p.halls.forEach(h => { c += countHallFaults(h); });
      return c;
    }

    function updateGlobalHeader() {
      const faults = getAllFaults();
      const banner = document.getElementById('globalAlarmBanner');
      const led = document.getElementById('globalAlarmLed');
      const text = document.getElementById('globalAlarmText');
      const backBtn = document.getElementById('backHomeBtn');

      backBtn.style.display = state.view === 'project' ? 'inline-flex' : 'none';

      if (faults.length === 0) {
        banner.className = 'alarm-pill ok';
        led.className = 'led green';
        text.textContent = 'هەموو ئامێرەکان بێ کێشەن (گڵۆپی سەوز)';
      } else {
        banner.className = 'alarm-pill fault';
        led.className = 'led red';
        text.textContent = `${faults.length} کێشە لە ئامێرەکاندا هەیە! (کلیک بکە)`;
      }
    }

    function goHome() {
      state.view = 'home';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openProject(projectId, tab = 'halls', hallId = 1) {
      state.view = 'project';
      state.selectedProjectId = projectId;
      state.activeTab = tab;
      state.selectedHallId = hallId;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setProjectTab(tab) {
      state.activeTab = tab;
      render();
    }

    function selectHall(hallId) {
      state.selectedHallId = hallId;
      render();
    }

    function setEquipmentFilter(filter) {
      state.equipmentFilter = filter;
      render();
    }

    function render() {
      updateGlobalHeader();
      const container = document.getElementById('appContainer');
      if (state.view === 'home') {
        container.innerHTML = renderHomeView();
      } else {
        container.innerHTML = renderProjectView();
      }
    }

    function renderHomeView() {
      const totalFaults = getAllFaults().length;
      const totalPresentStaff = state.projects.reduce((acc, p) => acc + p.staff.filter(s => s.status === 'present').length, 0);
      const totalFeed = state.projects.reduce((acc, p) => acc + p.halls.reduce((s, h) => s + h.silo.currentTons, 0), 0).toFixed(0);

      const cardsHtml = state.projects.map(p => {
        const fCount = countProjectFaults(p);
        const presentStaff = p.staff.filter(s => s.status === 'present').length;
        const feedTons = p.halls.reduce((acc, h) => acc + h.silo.currentTons, 0).toFixed(1);
        const activeGens = p.generators.filter(g => g.on && !g.fault).length;

        const hallsBars = p.halls.map(h => {
          const hf = countHallFaults(h);
          return `<div class="mini-hall-bar ${hf > 0 ? 'fault' : ''}" title="${h.name}">H${h.id}</div>`;
        }).join('');

        return `
          <div class="project-card ${fCount > 0 ? 'has-fault' : ''}" onclick="openProject(${p.id})">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <h3 style="font-size:1.1rem; font-weight:800;">${p.name}</h3>
              <span class="led ${fCount > 0 ? 'red' : 'green'}"></span>
            </div>

            <div class="iso-map-box">
              <div style="font-size:0.74rem; color:var(--text-muted); margin-bottom:8px;">نەخشەی ڕاستەوخۆی هەر ١٠ هۆڵەکە (80m × 20m)</div>
              <div class="iso-halls-grid">
                ${hallsBars}
              </div>
            </div>

            <div class="card-metrics-grid">
              <div class="mini-metric">
                <span>دۆخی ئامێرەکان</span>
                <strong style="color:${fCount > 0 ? '#fda4af' : '#6ee7b7'}">
                  ${fCount > 0 ? `${fCount} کێشە هەیە` : 'تەواو سەلامەتە'}
                </strong>
              </div>
              <div class="mini-metric">
                <span>ستافی ئامادەبوو</span>
                <strong>${presentStaff} لە ${p.staff.length} کارمەند</strong>
              </div>
              <div class="mini-metric">
                <span>مۆلیدەی کارا</span>
                <strong>${activeGens} / 2 مۆلیدە</strong>
              </div>
              <div class="mini-metric">
                <span>عەلەفی سایلۆکان</span>
                <strong>${feedTons} تەن</strong>
              </div>
            </div>

            <button class="btn btn-primary" style="width:100%;">
              کردنەوەی کۆنتڕۆڵی پڕۆژە ⬅️
            </button>
          </div>
        `;
      }).join('');

      return `
        <div class="global-stats-bar">
          <div class="stat-tile">
            <div class="stat-icon">🏭</div>
            <div class="stat-info">
              <span>کۆی پڕۆژەکان و هۆڵەکان</span>
              <strong>٨ پڕۆژە • ٨٠ هۆڵ</strong>
            </div>
          </div>
          <div class="stat-tile">
            <div class="stat-icon">🌾</div>
            <div class="stat-info">
              <span>کۆی عەلەفی ناو سایلۆکان</span>
              <strong>${totalFeed} تەن</strong>
            </div>
          </div>
          <div class="stat-tile">
            <div class="stat-icon">👷</div>
            <div class="stat-info">
              <span>ستافی ئامادەبووی ئەمڕۆ</span>
              <strong>${totalPresentStaff} / ٢٠٠ کەس</strong>
            </div>
          </div>
          <div class="stat-tile">
            <div class="stat-icon">${totalFaults === 0 ? '✅' : '🚨'}</div>
            <div class="stat-info">
              <span>دۆخی گشتی ئەلارمەکان</span>
              <strong style="color:${totalFaults === 0 ? '#6ee7b7' : '#fda4af'}">${totalFaults} کێشەی چالاک</strong>
            </div>
          </div>
        </div>

        <div class="section-heading">
          <h2>پانێڵی سەرەکی پڕۆژەکانی دەواجن</h2>
          <span style="font-size:0.85rem; color:var(--text-muted);">کلیک لەسەر هەر پڕۆژەیەک بکە بۆ چوونە ناو هۆڵەکان و بەڕێوەبردنی ستاف</span>
        </div>

        <div class="projects-grid">
          ${cardsHtml}
        </div>
      `;
    }

    function renderProjectView() {
      const project = state.projects.find(p => p.id === state.selectedProjectId);
      const fCount = countProjectFaults(project);

      let contentHtml = '';
      if (state.activeTab === 'halls') contentHtml = renderHallsSection(project);
      else if (state.activeTab === 'power') contentHtml = renderPowerAndShowerSection(project);
      else if (state.activeTab === 'silos') contentHtml = renderSilosSection(project);
      else if (state.activeTab === 'staff') contentHtml = renderStaffSection(project);

      return `
        <div class="project-top-bar">
          <div>
            <div style="display:flex; align-items:center; gap:10px;">
              <span class="led ${fCount > 0 ? 'red' : 'green'}"></span>
              <h2 style="font-size:1.3rem; font-weight:800;">${project.name}</h2>
            </div>
            <p style="font-size:0.82rem; color:var(--text-muted); margin-top:2px;">
              ١٠ هۆڵی ستاندارد (80m × 20m) • ٢ مۆلیدە • حەمامی تەعقیم • ٢٥ کارمەند
            </p>
          </div>

          <div class="project-switcher">
            ${state.projects.map(p => `
              <button class="p-switch-btn ${p.id === project.id ? 'active' : ''}" onclick="openProject(${p.id}, '${state.activeTab}', 1)">
                پڕۆژەی ${p.id}
              </button>
            `).join('')}
          </div>
        </div>

        <div class="main-tabs">
          <button class="main-tab-btn ${state.activeTab === 'halls' ? 'active' : ''}" onclick="setProjectTab('halls')">
            🎛️ هۆڵەکان و ئامێرەکان (١٠)
          </button>
          <button class="main-tab-btn ${state.activeTab === 'power' ? 'active' : ''}" onclick="setProjectTab('power')">
            ⚡ مۆلیدە (٢) و حەمامی تەعقیم
          </button>
          <button class="main-tab-btn ${state.activeTab === 'silos' ? 'active' : ''}" onclick="setProjectTab('silos')">
            🌾 سایلۆکانی عەلەف (١٠)
          </button>
          <button class="main-tab-btn ${state.activeTab === 'staff' ? 'active' : ''}" onclick="setProjectTab('staff')">
            👥 غیابات و ناوی ستاف (٢٥)
          </button>
        </div>

        ${contentHtml}
      `;
    }

    function renderHallsSection(project) {
      const hall = project.halls.find(h => h.id === state.selectedHallId) || project.halls[0];

      const hallsTabsHtml = project.halls.map(h => {
        const hf = countHallFaults(h);
        return `
          <div class="hall-tab ${h.id === hall.id ? 'active' : ''} ${hf > 0 ? 'fault' : ''}" onclick="selectHall(${h.id})">
            <span>${h.name}</span>
            <span class="led ${hf > 0 ? 'red' : 'green'}"></span>
          </div>
        `;
      }).join('');

      const filter = state.equipmentFilter;

      return `
        <div class="halls-strip">
          ${hallsTabsHtml}
        </div>

        <!-- هەستەوەرەکانی ژینگە و ئەلارمەکانی هۆڵ -->
        <div class="env-grid">
          <div class="env-card ${hall.alarms.tempColdHeat ? 'alarm' : ''}">
            <div>
              <div style="font-size:0.8rem; color:var(--text-muted);">ئەلارمی ساردی و گەرمی (${hall.name})</div>
              <div class="env-val">${hall.temp}°C</div>
              <div style="font-size:0.76rem; color:${hall.alarms.tempColdHeat ? '#fda4af' : '#6ee7b7'}">
                ${hall.alarms.tempColdHeat ? '⚠️ پلەی گەرمی نائاساییە!' : 'پلەی گەرمی جێگیرە'}
              </div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
              <span class="led ${hall.alarms.tempColdHeat ? 'red' : 'green'}"></span>
              <button class="sim-fault-btn ${hall.alarms.tempColdHeat ? 'fix' : ''}" onclick="toggleHallAlarm(${project.id}, ${hall.id}, 'tempColdHeat')">
                ${hall.alarms.tempColdHeat ? 'چاککردن' : 'تاقیکردنەوە'}
              </button>
            </div>
          </div>

          <div class="env-card ${hall.alarms.n2 ? 'alarm' : ''}">
            <div>
              <div style="font-size:0.8rem; color:var(--text-muted);">ئەلارمی نایترۆجین / ئەمۆنیا (N2)</div>
              <div class="env-val">${hall.n2_ppm} PPM</div>
              <div style="font-size:0.76rem; color:${hall.alarms.n2 ? '#fda4af' : '#6ee7b7'}">
                ${hall.alarms.n2 ? '⚠️ ڕێژەی گاز بەرزە!' : 'هەوای ناو هۆڵ پاکە'}
              </div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
              <span class="led ${hall.alarms.n2 ? 'red' : 'green'}"></span>
              <button class="sim-fault-btn ${hall.alarms.n2 ? 'fix' : ''}" onclick="toggleHallAlarm(${project.id}, ${hall.id}, 'n2')">
                ${hall.alarms.n2 ? 'چاککردن' : 'تاقیکردنەوە'}
              </button>
            </div>
          </div>

          <div class="env-card ${hall.alarms.co2 ? 'alarm' : ''}">
            <div>
              <div style="font-size:0.8rem; color:var(--text-muted);">ئەلارمی گازی دووانەئۆکسید (CO2)</div>
              <div class="env-val">${hall.co2_ppm} PPM</div>
              <div style="font-size:0.76rem; color:${hall.alarms.co2 ? '#fda4af' : '#6ee7b7'}">
                ${hall.alarms.co2 ? '⚠️ پێویستی بە هەواگۆڕکێیە!' : 'ئاستی CO2 ئاساییە'}
              </div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
              <span class="led ${hall.alarms.co2 ? 'red' : 'green'}"></span>
              <button class="sim-fault-btn ${hall.alarms.co2 ? 'fix' : ''}" onclick="toggleHallAlarm(${project.id}, ${hall.id}, 'co2')">
                ${hall.alarms.co2 ? 'چاککردن' : 'تاقیکردنەوە'}
              </button>
            </div>
          </div>
        </div>

        <!-- فلتەری بەشەکان بۆ ڕێگری لە قەرەباڵغی -->
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
          <div class="category-filter-bar" style="margin-bottom:0;">
            <button class="cat-chip ${filter === 'all' ? 'active' : ''}" onclick="setEquipmentFilter('all')">📋 هەموو بەشەکان</button>
            <button class="cat-chip ${filter === 'elec' ? 'active' : ''}" onclick="setEquipmentFilter('elec')">⚡ لوحەی کارەبا (٢)</button>
            <button class="cat-chip ${filter === 'fans' ? 'active' : ''}" onclick="setEquipmentFilter('fans')">🌀 ساحیبەکان و تونێل (١٦)</button>
            <button class="cat-chip ${filter === 'climate' ? 'active' : ''}" onclick="setEquipmentFilter('climate')">🔥 هیتەر و شەلال و پەنجەرە (١٢)</button>
            <button class="cat-chip ${filter === 'feedLight' ? 'active' : ''}" onclick="setEquipmentFilter('feedLight')">🌾 دانخۆری و ڕووناکی (١٢)</button>
          </div>

          <div style="display:flex; gap:8px;">
            <button class="btn btn-success" onclick="turnAllHallDevices(${project.id}, ${hall.id}, true)">ئیشپێکردنی هەمووی (ON)</button>
            <button class="btn" onclick="turnAllHallDevices(${project.id}, ${hall.id}, false)">کوژاندنەوەی هەمووی (OFF)</button>
          </div>
        </div>

        ${(filter === 'all' || filter === 'elec') ? renderEquipGroup(project.id, hall.id, 'elecPanels', '⚡ لوحەی کارەبای مەرکەزی هۆڵ (٢ لوحە)', hall.elecPanels) : ''}
        ${(filter === 'all' || filter === 'fans') ? renderEquipGroup(project.id, hall.id, 'exhaustFans', '🌀 ساحیبەکانی هەواگۆڕکێ (١٤ ساحیبە)', hall.exhaustFans) : ''}
        ${(filter === 'all' || filter === 'fans') ? renderEquipGroup(project.id, hall.id, 'tunnelFans', '🌬️ ساحیبەی تونێلی ساردی و گەرمی (٢ ساحیبە)', hall.tunnelFans) : ''}
        ${(filter === 'all' || filter === 'climate') ? renderEquipGroup(project.id, hall.id, 'heaters', '🔥 هیتەرەکانی گەرمکەرەوە (٦ هیتەر)', hall.heaters) : ''}
        ${(filter === 'all' || filter === 'climate') ? renderEquipGroup(project.id, hall.id, 'coolingMotors', '💧 ماتۆڕی شەلالی ساردکەرەوە (٤ ماتۆڕ)', hall.coolingMotors) : ''}
        ${(filter === 'all' || filter === 'climate') ? renderEquipGroup(project.id, hall.id, 'ventWindows', '🪟 پەنجەرەی تەهویەی ڕاست و چەپ (٢ هێڵ)', hall.ventWindows) : ''}
        ${(filter === 'all' || filter === 'feedLight') ? renderEquipGroup(project.id, hall.id, 'feedLines', '🌾 هێڵەکانی دانخۆری ئۆتۆماتیکی (٦ هێڵ)', hall.feedLines) : ''}
        ${(filter === 'all' || filter === 'feedLight') ? renderEquipGroup(project.id, hall.id, 'lightLines', '💡 هێڵەکانی ڕووناکی ناوەوە (٦ هێڵ)', hall.lightLines) : ''}
      `;
    }

    function renderEquipGroup(pId, hId, groupKey, title, devices) {
      const onCount = devices.filter(d => d.on && !d.fault).length;
      const cards = devices.map(d => {
        const statusText = d.fault
          ? '⚠️ کێشە لە ئامێرەکەدا هەیە'
          : (d.on ? '✅ لە کاردایە (ON)' : '⏸️ کوژاوەتەوە (OFF)');

        const extra = d.voltage
          ? `<div style="font-size:0.75rem; color:#38bdf8;">ڤۆڵتیە: ${d.voltage} • ئەلێکتریک: ${d.loadAmp}</div>`
          : (d.openPercent !== undefined ? `<div style="font-size:0.75rem; color:#38bdf8;">ڕێژەی کرانەوە: ${d.on ? d.openPercent : 0}%</div>` : '');

        return `
          <div class="device-card ${d.fault ? 'is-fault' : (d.on ? 'is-on' : '')}">
            <div class="device-card-top">
              <span>${d.name}</span>
              <span class="led ${d.fault ? 'red' : 'green'}"></span>
            </div>
            <div style="font-size:0.76rem; color:var(--text-muted);">${statusText}</div>
            ${extra}
            <div class="device-actions">
              <button class="power-btn ${d.on ? 'on' : 'off'}" onclick="toggleDevice(${pId}, ${hId}, '${groupKey}', '${d.id}')">
                ${d.on ? 'ئیشپێکراو (ON)' : 'کوژاوە (OFF)'}
              </button>
              <button class="sim-fault-btn ${d.fault ? 'fix' : ''}" onclick="toggleDeviceFault(${pId}, ${hId}, '${groupKey}', '${d.id}')">
                ${d.fault ? 'چاککردن' : 'ئەلارم'}
              </button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="equip-group-card">
          <div class="equip-group-header">
            <h4 style="font-size:1.02rem; font-weight:800;">${title}</h4>
            <span style="font-size:0.8rem; color:var(--text-muted);">چالاک: ${onCount} لە ${devices.length} ئامێر</span>
          </div>
          <div class="devices-grid">
            ${cards}
          </div>
        </div>
      `;
    }

    function renderPowerAndShowerSection(project) {
      const sh = project.sanitationShower;
      const gensHtml = project.generators.map((g, idx) => `
        <div class="equip-group-card" style="margin-bottom:0;">
          <div class="equip-group-header">
            <h4>⚡ ${g.name}</h4>
            <span class="led ${g.fault ? 'red' : 'green'}"></span>
          </div>
          <div class="card-metrics-grid" style="margin-bottom:14px;">
            <div class="mini-metric"><span>دۆخی کارکردن</span><strong>${g.fault ? 'کێشەی هونەری' : (g.on ? 'لە کاردایە (ON)' : 'ئامادەباش (Standby)')}</strong></div>
            <div class="mini-metric"><span>ڤۆڵتیە و فرێکوێنسی</span><strong>${g.on ? g.voltage + ' / ' + g.freq : '0V / 0Hz'}</strong></div>
            <div class="mini-metric"><span>ئاستی سووتەمەنی (گازوایل)</span><strong>${g.fuelPercent}%</strong></div>
            <div class="mini-metric"><span>کاتژمێری کارکردن</span><strong>${g.hours} کاتژمێر</strong></div>
          </div>
          <div style="display:flex; gap:10px;">
            <button class="power-btn ${g.on ? 'on' : 'off'}" style="padding:11px;" onclick="toggleGenerator(${project.id}, ${idx})">
              ${g.on ? 'مۆلیدە لە کاردایە (ON)' : 'ئیشپێکردنی مۆلیدە (OFF)'}
            </button>
            <button class="sim-fault-btn ${g.fault ? 'fix' : ''}" onclick="toggleGeneratorFault(${project.id}, ${idx})">
              ${g.fault ? 'چاککردنەوە' : 'تاقیکردنەوەی کێشە'}
            </button>
          </div>
        </div>
      `).join('');

      return `
        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:18px; margin-bottom:20px;">
          ${gensHtml}
        </div>

        <div class="equip-group-card">
          <div class="equip-group-header">
            <h4>🚿 ${sh.name}</h4>
            <span class="led ${sh.fault ? 'red' : 'green'}"></span>
          </div>
          <div class="card-metrics-grid" style="margin-bottom:14px;">
            <div class="mini-metric"><span>دۆخی مەرحەلەی تەعقیم</span><strong>${sh.fault ? 'کێشەی هەیە' : (sh.on ? 'چالاکە (ON)' : 'ڕاگیراوە (OFF)')}</strong></div>
            <div class="mini-metric"><span>ڕێژەی ماددەی تەعقیم</span><strong>${sh.disinfectantLevel}%</strong></div>
            <div class="mini-metric"><span>ژمارەی تەعقیمکراوی ئەمڕۆ</span><strong>${sh.todayEntries} کەس</strong></div>
            <div class="mini-metric"><span>قوفڵی ئەلیکترۆنی دەرگا</span><strong>پەیوەستکراوە بە تەعقیم</strong></div>
          </div>
          <div style="display:flex; gap:10px; max-width:420px;">
            <button class="power-btn ${sh.on ? 'on' : 'off'}" style="padding:11px;" onclick="toggleShower(${project.id})">
              ${sh.on ? 'حەمامی تەعقیم چالاکە (ON)' : 'ئیشپێکردنی حەمامی تەعقیم (OFF)'}
            </button>
            <button class="sim-fault-btn ${sh.fault ? 'fix' : ''}" onclick="toggleShowerFault(${project.id})">
              ${sh.fault ? 'چاککردنەوە' : 'تاقیکردنەوەی کێشە'}
            </button>
          </div>
        </div>
      `;
    }

    function renderSilosSection(project) {
      const cards = project.halls.map(h => {
        const s = h.silo;
        const pct = Math.round((s.currentTons / s.capacityTons) * 100);
        return `
          <div class="silo-box" style="border-color:${s.fault ? 'var(--danger)' : 'var(--border)'}">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong>سایلۆی ${h.name}</strong>
              <span class="led ${s.fault ? 'red' : 'green'}"></span>
            </div>
            <div class="silo-cylinder">
              <div class="silo-level" style="height:${pct}%; background:${pct < 25 ? '#f43f5e' : 'linear-gradient(180deg, #fbbf24, #d97706)'}"></div>
              <div class="silo-pct-label">${pct}%</div>
            </div>
            <div style="font-size:0.86rem; margin-bottom:12px;">
              بڕی عەلەف: <strong>${s.currentTons} تەن</strong> لە ${s.capacityTons} تەن
            </div>
            <div style="display:flex; flex-direction:column; gap:6px;">
              <button class="power-btn ${s.augerOn ? 'on' : 'off'}" onclick="toggleSiloAuger(${project.id}, ${h.id})">
                ماتۆڕی عەلەفکێش: ${s.augerOn ? 'ON' : 'OFF'}
              </button>
              <div style="display:flex; gap:6px;">
                <button class="btn" style="flex:1; font-size:0.75rem;" onclick="refillSilo(${project.id}, ${h.id})">➕ پڕکردنەوە</button>
                <button class="sim-fault-btn ${s.fault ? 'fix' : ''}" onclick="toggleSiloFault(${project.id}, ${h.id})">${s.fault ? 'چاککردن' : 'کێشە'}</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="equip-group-card">
          <div class="equip-group-header">
            <h4>🌾 سایلۆکانی عەلەفی هەر ١٠ هۆڵەکە</h4>
            <button class="btn btn-primary" onclick="refillAllSilos(${project.id})">➕ پڕکردنەوەی هەموو سایلۆکان (٢٥ تەن)</button>
          </div>
          <div class="silos-grid">
            ${cards}
          </div>
        </div>
      `;
    }

    function renderStaffSection(project) {
      const presentCount = project.staff.filter(s => s.status === 'present').length;
      const absentCount = project.staff.filter(s => s.status === 'absent').length;
      const leaveCount = project.staff.filter(s => s.status === 'leave').length;

      const rows = project.staff.map((s, idx) => `
        <tr>
          <td>${idx + 1}</td>
          <td><strong>${s.name}</strong></td>
          <td><span class="role-tag">${s.role}</span></td>
          <td style="direction:ltr; text-align:right;">${s.phone}</td>
          <td>
            <button class="att-chip present ${s.status === 'present' ? 'active' : ''}" onclick="setAttendance(${project.id}, '${s.id}', 'present')">✅ ئامادە</button>
            <button class="att-chip absent ${s.status === 'absent' ? 'active' : ''}" onclick="setAttendance(${project.id}, '${s.id}', 'absent')">❌ غائب</button>
            <button class="att-chip leave ${s.status === 'leave' ? 'active' : ''}" onclick="setAttendance(${project.id}, '${s.id}', 'leave')">🕒 مۆڵەت</button>
          </td>
          <td>
            <button class="btn" style="padding:6px 12px; font-size:0.78rem;" onclick="openEditStaffModal(${project.id}, '${s.id}')">✏️ گۆڕینی ناو</button>
          </td>
        </tr>
      `).join('');

      return `
        <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
          <div class="btn btn-success">✅ ئامادەبووان: ${presentCount} کەس</div>
          <div class="btn btn-danger">❌ نەهاتووان (غیاب): ${absentCount} کەس</div>
          <div class="btn">🕒 مۆڵەت: ${leaveCount} کەس</div>
          <button class="btn btn-primary" style="margin-right:auto;" onclick="markAllStaffPresent(${project.id})">
            دیاریکردنی هەمووان وەک ئامادەبوو
          </button>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>ناوی سیانی کارمەند</th>
                <th>پیشە و بەرپرسیارێتی</th>
                <th>ژمارەی مۆبایل</th>
                <th>تۆماری حضور و غیابات</th>
                <th>دەستکاریکردن (تعدیل)</th>
              </tr>
            </thead>
            <tbody>
              ${rows}
            </tbody>
          </table>
        </div>
      `;
    }

    // کارکردنەکان و گۆڕینی دۆخەکان
    function toggleDevice(pId, hId, groupKey, devId) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      const dev = h[groupKey].find(x => x.id === devId);
      dev.on = !dev.on;
      saveState();
      render();
    }

    function toggleDeviceFault(pId, hId, groupKey, devId) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      const dev = h[groupKey].find(x => x.id === devId);
      dev.fault = !dev.fault;
      if (dev.fault) dev.on = false;
      saveState();
      render();
    }

    function toggleHallAlarm(pId, hId, alarmKey) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      h.alarms[alarmKey] = !h.alarms[alarmKey];
      if (alarmKey === 'tempColdHeat') h.temp = h.alarms[alarmKey] ? 34.2 : 24.8;
      if (alarmKey === 'n2') h.n2_ppm = h.alarms[alarmKey] ? 46 : 14;
      if (alarmKey === 'co2') h.co2_ppm = h.alarms[alarmKey] ? 4300 : 1900;
      saveState();
      render();
    }

    function turnAllHallDevices(pId, hId, onState) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      [
        h.elecPanels, h.exhaustFans, h.tunnelFans, h.heaters,
        h.coolingMotors, h.ventWindows, h.feedLines, h.lightLines
      ].forEach(grp => grp.forEach(d => {
        if (!d.fault) d.on = onState;
      }));
      saveState();
      render();
    }

    function toggleGenerator(pId, gIdx) {
      const p = state.projects.find(x => x.id === pId);
      p.generators[gIdx].on = !p.generators[gIdx].on;
      saveState();
      render();
    }

    function toggleGeneratorFault(pId, gIdx) {
      const p = state.projects.find(x => x.id === pId);
      const g = p.generators[gIdx];
      g.fault = !g.fault;
      if (g.fault) g.on = false;
      saveState();
      render();
    }

    function toggleShower(pId) {
      const p = state.projects.find(x => x.id === pId);
      p.sanitationShower.on = !p.sanitationShower.on;
      saveState();
      render();
    }

    function toggleShowerFault(pId) {
      const p = state.projects.find(x => x.id === pId);
      p.sanitationShower.fault = !p.sanitationShower.fault;
      saveState();
      render();
    }

    function toggleSiloAuger(pId, hId) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      h.silo.augerOn = !h.silo.augerOn;
      saveState();
      render();
    }

    function toggleSiloFault(pId, hId) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      h.silo.fault = !h.silo.fault;
      saveState();
      render();
    }

    function refillSilo(pId, hId) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      h.silo.currentTons = h.silo.capacityTons;
      h.silo.fault = false;
      saveState();
      render();
    }

    function refillAllSilos(pId) {
      const p = state.projects.find(x => x.id === pId);
      p.halls.forEach(h => {
        h.silo.currentTons = h.silo.capacityTons;
        h.silo.fault = false;
      });
      saveState();
      render();
    }

    function setAttendance(pId, staffId, status) {
      const p = state.projects.find(x => x.id === pId);
      const member = p.staff.find(s => s.id === staffId);
      member.status = status;
      saveState();
      render();
    }

    function markAllStaffPresent(pId) {
      const p = state.projects.find(x => x.id === pId);
      p.staff.forEach(s => s.status = 'present');
      saveState();
      render();
    }

    let editingContext = null;
    function openEditStaffModal(pId, staffId) {
      const p = state.projects.find(x => x.id === pId);
      const member = p.staff.find(s => s.id === staffId);
      editingContext = { pId, staffId };
      document.getElementById('editStaffName').value = member.name;
      document.getElementById('editStaffRole').value = member.role;
      document.getElementById('editStaffPhone').value = member.phone;
      document.getElementById('editStaffModal').classList.add('open');
    }

    function closeStaffModal() {
      document.getElementById('editStaffModal').classList.remove('open');
      editingContext = null;
    }

    function saveStaffEdit() {
      if (!editingContext) return;
      const p = state.projects.find(x => x.id === editingContext.pId);
      const member = p.staff.find(s => s.id === editingContext.staffId);
      const newName = document.getElementById('editStaffName').value.trim();
      const newPhone = document.getElementById('editStaffPhone').value.trim();
      if (newName) member.name = newName;
      member.phone = newPhone;
      saveState();
      closeStaffModal();
      render();
    }

    function openFaultsModal() {
      const faults = getAllFaults();
      const box = document.getElementById('faultsListContainer');
      if (faults.length === 0) {
        box.innerHTML = `<p style="padding:20px; text-align:center; color:#6ee7b7;">هیچ کێشەیەک لە هیچ کام لە ٨ پڕۆژەکەدا نییە. هەموو ئامێرەکان سەلامەتن.</p>`;
      } else {
        box.innerHTML = faults.map(f => `
          <div style="display:flex; justify-content:space-between; align-items:center; background:var(--bg-card); border:1px solid var(--danger); padding:12px 16px; border-radius:12px; margin-bottom:10px; gap:10px;">
            <div>
              <strong>${f.pName} • ${f.location}</strong>
              <div style="font-size:0.82rem; color:#fda4af;">⚠️ ${f.item}</div>
            </div>
            <button class="btn btn-primary" onclick="jumpToFault(${f.pId}, ${f.hId || 1})">چوونە سەر شوێن</button>
          </div>
        `).join('');
      }
      document.getElementById('faultsModal').classList.add('open');
    }

    function closeFaultsModal() {
      document.getElementById('faultsModal').classList.remove('open');
    }

    function jumpToFault(pId, hId) {
      closeFaultsModal();
      openProject(pId, 'halls', hId);
    }

    function fixAllFaults() {
      state.projects.forEach(p => {
        p.sanitationShower.fault = false;
        p.generators.forEach(g => g.fault = false);
        p.halls.forEach(h => {
          h.alarms.tempColdHeat = false;
          h.alarms.n2 = false;
          h.alarms.co2 = false;
          h.silo.fault = false;
          [
            h.elecPanels, h.exhaustFans, h.tunnelFans, h.heaters,
            h.coolingMotors, h.ventWindows, h.feedLines, h.lightLines
          ].forEach(grp => grp.forEach(d => {
            if (d.fault) {
              d.fault = false;
              d.on = true;
            }
          }));
        });
      });
      saveState();
      closeFaultsModal();
      render();
    }

    function simulateRandomFault() {
      const pIdx = Math.floor(Math.random() * state.projects.length);
      const hIdx = Math.floor(Math.random() * 10);
      const hall = state.projects[pIdx].halls[hIdx];
      const groups = [hall.exhaustFans, hall.heaters, hall.coolingMotors, hall.feedLines, hall.elecPanels];
      const grp = groups[Math.floor(Math.random() * groups.length)];
      const dev = grp[Math.floor(Math.random() * grp.length)];
      dev.fault = true;
      dev.on = false;
      saveState();
      render();
    }

    loadState();
    render();
  </script>
