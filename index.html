<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>سیستەمی پیشەیی کێڵگەکانی پەلەوەر | SCADA Pro V4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-body: #070b14;
      --bg-surface: #0f172a;
      --bg-card: #1e293b;
      --bg-chip: #090f1d;
      --border: rgba(148, 163, 184, 0.16);
      --border-focus: rgba(14, 165, 233, 0.5);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #0ea5e9;
      --primary-soft: rgba(14, 165, 233, 0.15);
      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.15);
      --danger: #f43f5e;
      --danger-soft: rgba(244, 63, 94, 0.18);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.16);
      --purple: #a855f7;
      --purple-soft: rgba(168, 85, 247, 0.15);
      --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.45);
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    body.light-mode {
      --bg-body: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-card: #f8fafc;
      --bg-chip: #e2e8f0;
      --border: rgba(15, 23, 42, 0.12);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 92px;
      transition: background-color 0.25s, color 0.25s;
      line-height: 1.55;
    }

    /* هێدەری سەرەوە */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      position: sticky;
      top: 0;
      z-index: 120;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
      flex-wrap: wrap;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 200px;
    }

    .app-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--emerald));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      color: #fff;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
    }

    .project-select {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 800;
      cursor: pointer;
      outline: none;
      width: 100%;
      max-width: 240px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      height: 38px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      transition: 0.2s;
      text-decoration: none;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: var(--primary);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-emerald {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: var(--emerald);
    }

    .btn-danger {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-amber {
      background: var(--amber-soft);
      border-color: var(--amber);
      color: var(--amber);
    }

    .alarm-pulse {
      animation: pulseDanger 1.2s infinite;
    }

    @keyframes pulseDanger {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); }
      50% { transform: scale(1.04); box-shadow: 0 0 14px 3px rgba(244, 63, 94, 0.5); }
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px 12px;
    }

    /* ستریپی ئامارەکانی سەرەوە */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .kpi-icon {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: var(--primary-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .kpi-card small {
      color: var(--text-muted);
      font-size: 0.72rem;
      display: block;
    }

    .kpi-card strong {
      font-size: 1.02rem;
      font-weight: 800;
    }

    /* کارتی پڕۆژەکان لە پەڕەی سەرەکی */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    .p-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .p-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
    }

    .p-card.has-fault {
      border-color: var(--danger);
    }

    .halls-mini-matrix {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      background: var(--bg-card);
      padding: 10px;
      border-radius: 12px;
    }

    .h-badge {
      height: 28px;
      border-radius: 7px;
      background: var(--emerald-soft);
      border: 1px solid var(--emerald);
      color: var(--emerald);
      font-size: 0.72rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .h-badge.fault {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }

    .p-stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }

    .p-stat-box {
      background: var(--bg-card);
      padding: 8px 6px;
      border-radius: 10px;
      font-size: 0.78rem;
    }

    .p-stat-box span {
      color: var(--text-muted);
      display: block;
      font-size: 0.68rem;
    }

    /* شریتی هۆڵەکان و دوگمەی Matrix View */
    .hall-nav-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .hall-pills-wrap {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
      flex: 1;
      scrollbar-width: none;
    }
    .hall-pills-wrap::-webkit-scrollbar { display: none; }

    .hall-pill {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .hall-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .hall-pill.fault {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* بانەری زانیاریی جووجکە و سایلۆ و مۆدی ئۆتۆماتیکی ناو هۆڵ */
    .hall-master-panel {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .flock-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }

    .flock-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .flock-item small {
      color: var(--text-muted);
      font-size: 0.72rem;
      display: block;
    }

    .flock-item strong {
      font-size: 0.95rem;
      font-weight: 800;
    }

    /* مۆدە زیرەکەکانی کەشوهەوا */
    .modes-strip {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .mode-chip {
      flex: 1;
      min-width: 115px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
    }

    .mode-chip.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* ٣ هەستەوەرەکەی کەشوهەوا */
    .sensors-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .sensor-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .sensor-box.alarm {
      background: var(--danger-soft);
      border-color: var(--danger);
    }

    .sensor-box .val {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--primary);
      margin: 2px 0;
    }

    .sensor-box.alarm .val {
      color: var(--danger);
    }

    /* کارتی گرووپی ئامێرەکان */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 12px;
    }

    .group-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 15px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .group-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .group-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .master-switch {
      padding: 6px 12px;
      border-radius: 50px;
      border: 1px solid var(--border);
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
    }

    .master-switch.on {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #fff;
    }

    .master-switch.off {
      background: var(--bg-card);
      color: var(--text-muted);
    }

    .units-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .unit-btn {
      min-width: 40px;
      height: 36px;
      padding: 0 9px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg-chip);
      color: var(--text-muted);
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
    }

    .unit-btn.on {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: var(--emerald);
    }

    .unit-btn.fault {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
      animation: pulseDanger 1s infinite;
    }

    /* خشتەی بەراوردی ١٠ هۆڵەکە بەیەکەوە (Matrix Table) */
    .matrix-wrap {
      overflow-x: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
    }

    .matrix-table th, .matrix-table td {
      padding: 11px 12px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      font-size: 0.82rem;
    }

    .matrix-table th {
      background: var(--bg-card);
      color: var(--primary);
      font-weight: 800;
    }

    /* کارتی ستاف و کارمەندان */
    .search-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 0.88rem;
      margin-bottom: 12px;
      outline: none;
    }

    .staff-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px;
    }

    .staff-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .att-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .att-btn {
      padding: 7px 4px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
    }

    .att-btn.present.active { background: var(--emerald-soft); border-color: var(--emerald); color: var(--emerald); }
    .att-btn.absent.active { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
    .att-btn.leave.active { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }

    /* سایلۆکان */
    .silos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
    }

    .silo-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .progress-bar {
      height: 12px;
      background: var(--bg-chip);
      border-radius: 50px;
      overflow: hidden;
      margin: 8px 0;
      border: 1px solid var(--border);
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--amber), var(--emerald));
      transition: width 0.3s;
    }

    /* مێنوی خوارەوەی شاشە */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 6px 4px;
      z-index: 150;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 0.7rem;
      font-weight: 800;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 10px;
      transition: 0.2s;
    }

    .nav-btn .ico {
      font-size: 1.2rem;
    }

    .nav-btn.active {
      color: var(--primary);
      background: var(--primary-soft);
    }

    /* مۆداڵ */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 250;
      padding: 14px;
    }
    .modal-bg.open { display: flex; }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 520px;
      padding: 20px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      margin-top: 4px;
      margin-bottom: 12px;
      font-size: 0.88rem;
    }

    @media (max-width: 540px) {
      .sensors-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- هێدەری سەرەوە -->
  <header>
    <div class="header-right">
      <div class="app-logo" onclick="goHome()" title="گەڕانەوە بۆ پەڕەی سەرەکی">🐔</div>
      <select id="projectDropdown" class="project-select" onchange="onProjectSelect(this.value)"></select>
    </div>

    <div class="header-left">
      <button id="alarmBannerBtn" class="btn btn-emerald" onclick="openFaultsModal()">
        <span id="alarmBannerText">✅ ٠ کێشە</span>
      </button>
      <button class="btn" id="soundToggleBtn" onclick="toggleSound()" title="دەنگی زەنگی ئەلارم">🔊</button>
      <button class="btn" id="simModeBtn" onclick="toggleSimMode()" title="دۆخی تاقیکردنەوەی کێشە">🔧 تاقیکردنەوە</button>
      <button class="btn" id="themeToggleBtn" onclick="toggleTheme()" title="گۆڕینی ڕووناکی شاشە">☀️</button>
    </div>
  </header>

  <main id="appContainer"></main>

  <!-- مێنوی خوارەوەی مۆبایل -->
  <nav class="bottom-nav">
    <button class="nav-btn" id="nav-home" onclick="goHome()">
      <span class="ico">🏠</span>
      <span>٨ پڕۆژەکە</span>
    </button>
    <button class="nav-btn" id="nav-halls" onclick="switchTab('halls')">
      <span class="ico">🎛️</span>
      <span>١٠ هۆڵەکە</span>
    </button>
    <button class="nav-btn" id="nav-power" onclick="switchTab('power')">
      <span class="ico">⚡</span>
      <span>مۆلیدە و تەعقیم</span>
    </button>
    <button class="nav-btn" id="nav-silos" onclick="switchTab('silos')">
      <span class="ico">🌾</span>
      <span>١٠ سایلۆکە</span>
    </button>
    <button class="nav-btn" id="nav-staff" onclick="switchTab('staff')">
      <span class="ico">👥</span>
      <span>ستاف (٢٥)</span>
    </button>
    <button class="nav-btn" id="nav-logs" onclick="switchTab('logs')">
      <span class="ico">📜</span>
      <span>ڕاپۆرت و داتا</span>
    </button>
  </nav>

  <!-- مۆداڵی دەستکاری ناوی کارمەند -->
  <div class="modal-bg" id="staffModal">
    <div class="modal-box">
      <h3 style="margin-bottom:12px;">✏️ دەستکاریکردنی کارمەند</h3>
      <label style="font-size:0.78rem; color:var(--text-muted);">ناوی سیانی کارمەند:</label>
      <input type="text" id="staffNameInp" class="form-input" />
      <label style="font-size:0.78rem; color:var(--text-muted);">ژمارەی مۆبایل (بۆ پەیوەندی و واتسئەپ):</label>
      <input type="text" id="staffPhoneInp" class="form-input" placeholder="0750xxxxxxx" />
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="btn" onclick="closeStaffModal()">پاشگەزبوونەوە</button>
        <button class="btn btn-primary" onclick="saveStaffModal()">پاشەکەوتکردن</button>
      </div>
    </div>
  </div>

  <!-- مۆداڵی لیستی ئەلارمەکان -->
  <div class="modal-bg" id="faultsModal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;">
        <h3>🚨 لیستی ئەلارم و کێشە چالاکەکان</h3>
        <button class="btn btn-emerald" onclick="fixAllFaults()">✅ چاککردنەوەی هەمووی</button>
      </div>
      <div id="faultsListBox"></div>
      <div style="display:flex; justify-content:flex-end; margin-top:14px;">
        <button class="btn" onclick="closeFaultsModal()">داخستن</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'POULTRY_SCADA_PRO_V4';

    const FIRST_NAMES = ['کاروان','بەرهەم','سۆران','ئارام','دیار','هەڵۆ','ڕێبین','شوان','پشتیوان','زانا','هێمن','ئومێد','شاهین','بەختیار','کاردۆ','سەنگەر','نەبەز','ڕزگار','هاوکار','دلێر','کامەران','گۆران','سامان','یاسین','فەرهاد'];
    const LAST_NAMES = ['ئەحمەد','محەمەد','عەلی','حەسەن','ئیبراهیم','مەحموود','عوسمان','قادر','کەریم','سەعید','مستەفا','عەبدوڵڵا'];

    // دەنگی زەنگی ئەلارم بە Web Audio API (بێ پێویستی بە فایلی دەرەکی)
    let audioCtx = null;
    function playAlarmBeep() {
      if (!state.soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.setValueAtTime(440, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
        if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
      } catch (e) {}
    }

    function addLog(text) {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('ku-IQ', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      state.logs.unshift({ time: timeStr, text });
      if (state.logs.length > 60) state.logs.pop();
    }

    function createStaff(pIdx) {
      const roles = [
        'ئەندازیاری ئۆتۆمەیشن', 'دکتۆری تایبەتمەندی پەلەوەر', 'سەرپەرشتیاری کرێکارەکان',
        'وەستای کارەبا', 'کرێکاری میکانیک', 'پاسەوان', 'چێشتلێنەر'
      ];
      for (let i = 1; i <= 18; i++) roles.push(`کرێکاری هۆڵ (${i})`);

      return roles.map((role, idx) => ({
        id: `P${pIdx}_S${idx+1}`,
        name: `${FIRST_NAMES[(idx + pIdx*2) % FIRST_NAMES.length]} ${LAST_NAMES[(idx + pIdx) % LAST_NAMES.length]}`,
        role,
        phone: `0750${11 + pIdx}${2100 + idx}`,
        status: 'present'
      }));
    }

    function makeUnits(count, defaultOn = true) {
      return Array.from({ length: count }, (_, i) => ({ num: i + 1, on: defaultOn, fault: false }));
    }

    function createHall(hIdx) {
      const ageDays = 14 + (hIdx * 2);
      const targetTemp = +(33 - Math.min(ageDays * 0.35, 11)).toFixed(1);
      return {
        id: hIdx,
        name: `هۆڵی ${hIdx}`,
        dimensions: '80m × 20m',
        climateMode: 'auto', // 'auto' | 'summer' | 'winter' | 'vent'
        flock: {
          ageDays,
          birdsCount: 14850 - (hIdx * 12),
          mortalityToday: hIdx % 3
        },
        temp: targetTemp,
        targetTemp,
        n2: 11 + (hIdx % 4),
        co2: 1750 + hIdx * 30,
        alarms: { temp: false, n2: false, co2: false },
        silo: { tons: +(19.5 - (hIdx % 5) * 2.1).toFixed(1), max: 25, augerOn: true, fault: false },
        groups: {
          elecPanels: { title: 'لوحەی کارەبای مەرکەزی (٢)', icon: '⚡', label: 'لوحەی کارەبا', units: makeUnits(2, true) },
          exhaustFans: { title: 'ساحیبەکانی هەواگۆڕکێ (١٤)', icon: '🌀', label: 'ساحیبە', units: makeUnits(14, true) },
          tunnelFans: { title: 'ساحیبەی تونێل - ساردی/گەرمی (٢)', icon: '🌬️', label: 'تونێل', units: makeUnits(2, true) },
          heaters: { title: 'هیتەرەکانی گەرمکەرەوە (٦)', icon: '🔥', label: 'هیتەر', units: makeUnits(6, false) },
          coolingMotors: { title: 'ماتۆڕی شەلالی ساردکەرەوە (٤)', icon: '💧', label: 'شەلال', units: makeUnits(4, true) },
          ventWindows: { title: 'پەنجەرەی تەهویەی ڕاست و چەپ (٢)', icon: '🪟', label: 'پەنجەرە', units: makeUnits(2, true) },
          feedLines: { title: 'هێڵی دانخۆری ئۆتۆماتیکی (٦)', icon: '🌾', label: 'هێڵی دانخۆری', units: makeUnits(6, true) },
          lightLines: { title: 'هێڵی ڕووناکی ناوەوە (٦)', icon: '💡', label: 'هێڵی ڕووناکی', units: makeUnits(6, true) }
        }
      };
    }

    function buildDefaultData() {
      return Array.from({ length: 8 }, (_, p) => ({
        id: p + 1,
        name: `پڕۆژەی دەواجنی (${p + 1})`,
        shower: { on: true, level: 92, entries: 19 + p, fault: false },
        generators: [
          { id: 1, name: 'مۆلیدەی سەرەکی (1) - 500 kVA', on: true, fuel: 85, hours: 1410 + p * 15, fault: false },
          { id: 2, name: 'مۆلیدەی یەدەگ (2) - 500 kVA', on: false, fuel: 96, hours: 820 + p * 10, fault: false }
        ],
        halls: Array.from({ length: 10 }, (_, h) => createHall(h + 1)),
        staff: createStaff(p + 1)
      }));
    }

    let state = {
      view: 'home', // 'home' | 'halls' | 'power' | 'silos' | 'staff' | 'logs'
      projectId: 1,
      hallId: 1,
      hallMatrixMode: false, // پیشاندانی خشتەی بەراوردی ١٠ هۆڵەکە بەیەکەوە
      simMode: false,
      soundEnabled: true,
      lightMode: false,
      staffSearch: '',
      projects: [],
      logs: []
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state.projects = parsed.projects || buildDefaultData();
          state.logs = parsed.logs || [];
        } else {
          state.projects = buildDefaultData();
          addLog('سیستەمی SCADA Pro V4 بە سەرکەوتوویی کەوتە کار.');
          saveState();
        }
      } catch (e) {
        state.projects = buildDefaultData();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          projects: state.projects,
          logs: state.logs
        }));
      } catch (e) {}
    }

    function getAllFaults() {
      const list = [];
      state.projects.forEach(p => {
        if (p.shower.fault) list.push({ pId: p.id, pName: p.name, tab: 'power', text: 'حەمامی تەعقیمی دەرگا' });
        p.generators.forEach(g => {
          if (g.fault) list.push({ pId: p.id, pName: p.name, tab: 'power', text: g.name });
        });
        p.halls.forEach(h => {
          if (h.alarms.temp) list.push({ pId: p.id, pName: p.name, hId: h.id, tab: 'halls', text: `${h.name}: ئەلارمی پلەی گەرمی (${h.temp}°C)` });
          if (h.alarms.n2) list.push({ pId: p.id, pName: p.name, hId: h.id, tab: 'halls', text: `${h.name}: بەرزی گازی N2 (${h.n2} PPM)` });
          if (h.alarms.co2) list.push({ pId: p.id, pName: p.name, hId: h.id, tab: 'halls', text: `${h.name}: بەرزی گازی CO2 (${h.co2} PPM)` });
          if (h.silo.fault) list.push({ pId: p.id, pName: p.name, hId: h.id, tab: 'silos', text: `سایلۆی عەلەفی ${h.name}` });
          Object.values(h.groups).forEach(grp => {
            grp.units.forEach(u => {
              if (u.fault) list.push({ pId: p.id, pName: p.name, hId: h.id, tab: 'halls', text: `${h.name} - ${grp.label} (${u.num})` });
            });
          });
        });
      });
      return list;
    }

    function countHallFaults(h) {
      let c = (h.alarms.temp ? 1 : 0) + (h.alarms.n2 ? 1 : 0) + (h.alarms.co2 ? 1 : 0) + (h.silo.fault ? 1 : 0);
      Object.values(h.groups).forEach(g => g.units.forEach(u => { if (u.fault) c++; }));
      return c;
    }

    function countProjectFaults(p) {
      let c = (p.shower.fault ? 1 : 0) + p.generators.filter(g => g.fault).length;
      p.halls.forEach(h => { c += countHallFaults(h); });
      return c;
    }

    function toggleTheme() {
      state.lightMode = !state.lightMode;
      document.body.classList.toggle('light-mode', state.lightMode);
      document.getElementById('themeToggleBtn').textContent = state.lightMode ? '🌙' : '☀️';
    }

    function toggleSound() {
      state.soundEnabled = !state.soundEnabled;
      document.getElementById('soundToggleBtn').textContent = state.soundEnabled ? '🔊' : '🔇';
    }

    function toggleSimMode() {
      state.simMode = !state.simMode;
      const btn = document.getElementById('simModeBtn');
      btn.className = state.simMode ? 'btn btn-amber' : 'btn';
      render();
    }

    function onProjectSelect(val) {
      if (val === 'home') {
        goHome();
      } else {
        state.projectId = parseInt(val, 10);
        if (state.view === 'home') state.view = 'halls';
        render();
      }
    }

    function goHome() {
      state.view = 'home';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openProject(pId, tab = 'halls', hId = 1) {
      state.projectId = pId;
      state.view = tab;
      state.hallId = hId;
      state.hallMatrixMode = false;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchTab(tab) {
      state.view = tab;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateNavigationUI() {
      const sel = document.getElementById('projectDropdown');
      sel.innerHTML = `<option value="home" ${state.view === 'home' ? 'selected' : ''}>🏠 هەموو پڕۆژەکان (٨ پڕۆژە)</option>` +
        state.projects.map(p => `<option value="${p.id}" ${state.view !== 'home' && state.projectId === p.id ? 'selected' : ''}>📍 ${p.name}</option>`).join('');

      const faults = getAllFaults();
      const alarmBtn = document.getElementById('alarmBannerBtn');
      const alarmTxt = document.getElementById('alarmBannerText');
      if (faults.length === 0) {
        alarmBtn.className = 'btn btn-emerald';
        alarmTxt.textContent = '✅ بێ کێشە';
      } else {
        alarmBtn.className = 'btn btn-danger alarm-pulse';
        alarmTxt.textContent = `🚨 ${faults.length} کێشە`;
      }

      ['home', 'halls', 'power', 'silos', 'staff', 'logs'].forEach(k => {
        const el = document.getElementById(`nav-${k}`);
        if (el) el.classList.toggle('active', state.view === k);
      });
    }

    function render() {
      updateNavigationUI();
      const container = document.getElementById('appContainer');
      const project = state.projects.find(p => p.id === state.projectId);

      if (state.view === 'home') container.innerHTML = renderHomeView();
      else if (state.view === 'halls') container.innerHTML = renderHallsView(project);
      else if (state.view === 'power') container.innerHTML = renderPowerView(project);
      else if (state.view === 'silos') container.innerHTML = renderSilosView(project);
      else if (state.view === 'staff') container.innerHTML = renderStaffView(project);
      else if (state.view === 'logs') container.innerHTML = renderLogsAndBackupView(project);
    }

    function renderHomeView() {
      const faultsCount = getAllFaults().length;
      const totalStaff = state.projects.reduce((s, p) => s + p.staff.filter(x => x.status === 'present').length, 0);
      const totalTons = state.projects.reduce((s, p) => s + p.halls.reduce((a, h) => a + h.silo.tons, 0), 0).toFixed(0);
      const totalBirds = state.projects.reduce((s, p) => s + p.halls.reduce((a, h) => a + h.flock.birdsCount, 0), 0).toLocaleString();

      const cards = state.projects.map(p => {
        const pf = countProjectFaults(p);
        const present = p.staff.filter(s => s.status === 'present').length;
        const tons = p.halls.reduce((a, h) => a + h.silo.tons, 0).toFixed(0);
        const badges = p.halls.map(h => {
          const hf = countHallFaults(h);
          return `<div class="h-badge ${hf > 0 ? 'fault' : ''}" title="${h.name}: ${h.temp}°C">H${h.id}</div>`;
        }).join('');

        return `
          <div class="p-card ${pf > 0 ? 'has-fault' : ''}" onclick="openProject(${p.id}, 'halls', 1)">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong style="font-size:1.05rem;">${p.name}</strong>
              <span style="font-size:0.78rem; font-weight:800; color:${pf > 0 ? 'var(--danger)' : 'var(--emerald)'}">
                ${pf > 0 ? `⚠️ ${pf} ئەلارم` : '🟢 بێ کێشە'}
              </span>
            </div>
            <div class="halls-mini-matrix">${badges}</div>
            <div class="p-stats-row">
              <div class="p-stat-box"><span>ستافی ئامادە</span><strong>${present}/25</strong></div>
              <div class="p-stat-box"><span>عەلەفی سایلۆ</span><strong>${tons} تەن</strong></div>
              <div class="p-stat-box"><span>مۆلیدەکان</span><strong>${p.generators.filter(g=>g.on).length}/2 کارا</strong></div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-icon">🏭</div>
            <div><small>پڕۆژە و هۆڵەکان</small><strong>٨ پڕۆژە • ٨٠ هۆڵ</strong></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon">🐥</div>
            <div><small>کۆی پەلەوەری زیندوو</small><strong>${totalBirds}</strong></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon">🌾</div>
            <div><small>کۆی عەلەفی سایلۆکان</small><strong>${totalTons} تەن</strong></div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon">👷</div>
            <div><small>ستافی ئامادەبوو</small><strong>${totalStaff} / ٢٠٠ کەس</strong></div>
          </div>
        </div>
        <div class="projects-grid">${cards}</div>
      `;
    }

    function renderHallsView(project) {
      const hall = project.halls.find(h => h.id === state.hallId) || project.halls[0];

      const hallPills = project.halls.map(h => {
        const hf = countHallFaults(h);
        return `
          <button class="hall-pill ${!state.hallMatrixMode && h.id === hall.id ? 'active' : ''} ${hf > 0 ? 'fault' : ''}"
                  onclick="state.hallMatrixMode=false; state.hallId=${h.id}; render();">
            <span>${h.name}</span>
            <span>${hf > 0 ? '🔴' : '🟢'}</span>
          </button>
        `;
      }).join('');

      if (state.hallMatrixMode) {
        return `
          <div class="hall-nav-row">
            <div class="hall-pills-wrap">${hallPills}</div>
            <button class="btn btn-primary" onclick="state.hallMatrixMode=false; render();">🎛️ گەڕانەوە بۆ کۆنتڕۆڵ</button>
          </div>
          ${renderHallsMatrixTable(project)}
        `;
      }

      const siloPct = Math.round((hall.silo.tons / hall.silo.max) * 100);

      const groupsHtml = Object.entries(hall.groups).map(([gKey, grp]) => {
        const activeCount = grp.units.filter(u => u.on && !u.fault).length;
        const allOn = activeCount === grp.units.length;

        const unitBtns = grp.units.map(u => `
          <button class="unit-btn ${u.fault ? 'fault' : (u.on ? 'on' : '')}"
                  onclick="handleUnitClick(${project.id}, ${hall.id}, '${gKey}', ${u.num})">
            ${u.num}
          </button>
        `).join('');

        return `
          <div class="group-card">
            <div class="group-head">
              <div class="group-title">
                <div class="group-icon">${grp.icon}</div>
                <div>
                  <strong style="font-size:0.92rem; display:block;">${grp.title}</strong>
                  <small style="color:var(--text-muted); font-size:0.74rem;">لە کاردایە: ${activeCount} لە ${grp.units.length}</small>
                </div>
              </div>
              <button class="master-switch ${allOn ? 'on' : 'off'}"
                      onclick="toggleWholeGroup(${project.id}, ${hall.id}, '${gKey}', ${!allOn})">
                ${allOn ? 'هەمووی ON' : 'هەمووی OFF'}
              </button>
            </div>
            <div class="units-wrap">${unitBtns}</div>
          </div>
        `;
      }).join('');

      return `
        <div class="hall-nav-row">
          <div class="hall-pills-wrap">${hallPills}</div>
          <button class="btn btn-primary" onclick="state.hallMatrixMode=true; render();" title="بینینی هەر ١٠ هۆڵەکە بەیەکەوە">
            📊 خشتەی ١٠ هۆڵەکە
          </button>
        </div>

        <!-- پانێڵی سەرەکی هۆڵ: جووجکە، سایلۆی هۆڵ، و مۆدی کەشوهەوای زیرەک -->
        <div class="hall-master-panel">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
            <div>
              <h3 style="font-size:1.1rem; font-weight:900;">🎛️ ${project.name} • ${hall.name} (${hall.dimensions})</h3>
              <small style="color:var(--text-muted);">پلەی گەرمی نموونەیی بۆ تەمەنی ${hall.flock.ageDays} ڕۆژ: <strong>${hall.targetTemp}°C</strong></small>
            </div>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-emerald" onclick="setAllHallUnits(${project.id}, ${hall.id}, true)">هەمووی ON</button>
              <button class="btn" onclick="setAllHallUnits(${project.id}, ${hall.id}, false)">هەمووی OFF</button>
            </div>
          </div>

          <div class="flock-bar">
            <div class="flock-item">
              <div><small>🐥 تەمەنی جووجکە</small><strong>${hall.flock.ageDays} ڕۆژ</strong></div>
              <div style="display:flex; gap:4px;">
                <button class="btn" style="height:28px; padding:0 8px;" onclick="changeFlockAge(${project.id}, ${hall.id}, 1)">+</button>
                <button class="btn" style="height:28px; padding:0 8px;" onclick="changeFlockAge(${project.id}, ${hall.id}, -1)">-</button>
              </div>
            </div>
            <div class="flock-item">
              <div><small>🐔 ژمارەی زیندوو</small><strong>${hall.flock.birdsCount.toLocaleString()}</strong></div>
              <span style="font-size:0.75rem; color:var(--emerald);">چالاک</span>
            </div>
            <div class="flock-item">
              <div><small>📉 تەلەفاتی ئەمڕۆ</small><strong style="color:var(--danger);">${hall.flock.mortalityToday} دانە</strong></div>
              <button class="btn btn-danger" style="height:28px; padding:0 8px;" onclick="recordMortality(${project.id}, ${hall.id})">+١ تەلەفات</button>
            </div>
            <div class="flock-item">
              <div><small>🌾 سایلۆی ${hall.name}</small><strong>${hall.silo.tons} تەن (${siloPct}%)</strong></div>
              <button class="btn" style="height:28px; padding:0 8px;" onclick="refillSilo(${project.id}, ${hall.id})">➕ پڕکردن</button>
            </div>
          </div>

          <!-- مۆدە زیرەکەکان (Smart Presets) -->
          <div class="modes-strip">
            <span style="font-size:0.78rem; font-weight:800; color:var(--text-muted);">مۆدی زیرەکی هۆڵ:</span>
            <button class="mode-chip ${hall.climateMode === 'auto' ? 'active' : ''}" onclick="applyClimatePreset(${project.id}, ${hall.id}, 'auto')">
              🤖 ئۆتۆماتیکی زیرەک
            </button>
            <button class="mode-chip ${hall.climateMode === 'summer' ? 'active' : ''}" onclick="applyClimatePreset(${project.id}, ${hall.id}, 'summer')">
              ❄️ فێنککردنەوەی هاوینە
            </button>
            <button class="mode-chip ${hall.climateMode === 'winter' ? 'active' : ''}" onclick="applyClimatePreset(${project.id}, ${hall.id}, 'winter')">
              🔥 گەرمکردنەوەی زستانە
            </button>
            <button class="mode-chip ${hall.climateMode === 'vent' ? 'active' : ''}" onclick="applyClimatePreset(${project.id}, ${hall.id}, 'vent')">
              🌬️ پاککردنەوەی گاز (پەلە)
            </button>
          </div>
        </div>

        <!-- ٣ هەستەوەرەکەی کەشوهەوا -->
        <div class="sensors-grid">
          <div class="sensor-box ${hall.alarms.temp ? 'alarm' : ''}" onclick="toggleSensorAlarm(${project.id}, ${hall.id}, 'temp')">
            <small style="color:var(--text-muted);">🌡️ ئەلارمی ساردی و گەرمی</small>
            <div class="val">${hall.temp}°C</div>

    function renderLogsAndBackupView(project) {
      const logItems = state.logs.map(l => `
        <div style="padding:9px 12px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; font-size:0.82rem;">

      return `

              دەتوانیت هەموو گۆڕانکارییەکانی ناو ئەپەکە (ناوی کارمەندان، غیابات، دۆخی ئامێرەکان) وەک فایل دابەزێنیت و لەسەر مۆبایلێکی تر بیکەیتەوە:

    // کردارەکان و کۆنتڕۆڵەکان
    function handleUnitClick(pId, hId, gKey, unitNum) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      const grp = h.groups[gKey];
      const u = grp.units.find(x => x.num === unitNum);

      if (state.simMode || u.fault) {
        u.fault = !u.fault;
        if (u.fault) {
          u.on = false;
          playAlarmBeep();
          addLog(`🚨 کێشە لە ${p.name} - ${h.name} - ${grp.label} (${u.num})`);
        } else {
          u.on = true;
          addLog(`✅ چاککردنەوەی ${p.name} - ${h.name} - ${grp.label} (${u.num})`);
        }
      } else {
        u.on = !u.on;
        addLog(`${u.on ? '🟢 ئیشپێکردنی' : '⚪ کوژاندنەوەی'} ${grp.label} (${u.num}) لە ${h.name} (${p.name})`);
      }
      saveState();
      render();
    }

    function toggleWholeGroup(pId, hId, gKey, targetOn) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      h.groups[gKey].units.forEach(u => { if (!u.fault) u.on = targetOn; });
      addLog(`${targetOn ? '🟢 ئیشپێکردنی هەموو' : '⚪ کوژاندنەوەی هەموو'} ${h.groups[gKey].label} لە ${h.name}`);
      saveState();
      render();
    }

    function setAllHallUnits(pId, hId, targetOn) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      Object.values(h.groups).forEach(g => g.units.forEach(u => { if (!u.fault) u.on = targetOn; }));
      addLog(`${targetOn ? '🟢 ئیشپێکردنی' : '⚪ کوژاندنەوەی'} تەواوی ئامێرەکانی ${h.name} (${p.name})`);
      saveState();
      render();
    }

    function applyClimatePreset(pId, hId, mode) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      h.climateMode = mode;

      if (mode === 'summer') {
        h.groups.exhaustFans.units.forEach(u => { if (!u.fault) u.on = true; });
        h.groups.coolingMotors.units.forEach(u => { if (!u.fault) u.on = true; });
        h.groups.tunnelFans.units.forEach(u => { if (!u.fault) u.on = true; });
        h.groups.heaters.units.forEach(u => { u.on = false; });
        h.temp = 23.5;
      } else if (mode === 'winter') {
        h.groups.heaters.units.forEach(u => { if (!u.fault) u.on = true; });
        h.groups.coolingMotors.units.forEach(u => { u.on = false; });
        h.groups.exhaustFans.units.forEach((u, i) => { if (!u.fault) u.on = i < 4; });
        h.temp = 28.5;
      } else if (mode === 'vent') {
        h.groups.exhaustFans.units.forEach(u => { if (!u.fault) u.on = true; });
        h.groups.ventWindows.units.forEach(u => { if (!u.fault) u.on = true; });
        h.n2 = 10;
        h.co2 = 1600;
        h.alarms.n2 = false;
        h.alarms.co2 = false;
      } else {
        h.groups.exhaustFans.units.forEach((u, i) => { if (!u.fault) u.on = i < 10; });
        h.groups.heaters.units.forEach(u => { u.on = false; });
        h.temp = h.targetTemp;
      }

      addLog(`🎛️ گۆڕینی مۆدی ${h.name} بۆ (${mode}) لە ${p.name}`);
      saveState();
      render();
    }

    function changeFlockAge(pId, hId, delta) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      h.flock.ageDays = Math.max(1, h.flock.ageDays + delta);
      h.targetTemp = +(33 - Math.min(h.flock.ageDays * 0.35, 11)).toFixed(1);
      saveState();
      render();
    }

    function recordMortality(pId, hId) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      h.flock.mortalityToday++;
      h.flock.birdsCount = Math.max(0, h.flock.birdsCount - 1);
      addLog(`📉 تۆمارکردنی ١ تەلەفات لە ${h.name} (${p.name})`);
      saveState();
      render();
    }

    function toggleSensorAlarm(pId, hId, key) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      h.alarms[key] = !h.alarms[key];
      if (key === 'temp') h.temp = h.alarms.temp ? 35.2 : h.targetTemp;
      if (key === 'n2') h.n2 = h.alarms.n2 ? 48 : 12;
      if (key === 'co2') h.co2 = h.alarms.co2 ? 4400 : 1850;
      if (h.alarms[key]) playAlarmBeep();
      saveState();
      render();
    }

    function toggleGen(pId, idx) {
      const p = state.projects.find(x => x.id === pId);
      p.generators[idx].on = !p.generators[idx].on;
      addLog(`⚡ مۆلیدەی (${idx + 1}) لە ${p.name} کرا بە ${p.generators[idx].on ? 'ON' : 'OFF'}`);
      saveState();
      render();
    }

    function toggleGenFault(pId, idx) {
      const p = state.projects.find(x => x.id === pId);
      const g = p.generators[idx];
      g.fault = !g.fault;
      if (g.fault) {
        g.on = false;
        playAlarmBeep();
      }
      saveState();
      render();
    }

    function refillSilo(pId, hId) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      h.silo.tons = h.silo.max;
      h.silo.fault = false;
      addLog(`🌾 پڕکردنەوەی سایلۆی ${h.name} لە ${p.name} (٢٥ تەن)`);
      saveState();
      render();
    }

    function refillAllSilos(pId) {
      const p = state.projects.find(x => x.id === pId);
      p.halls.forEach(h => { h.silo.tons = h.silo.max; h.silo.fault = false; });
      addLog(`🌾 پڕکردنەوەی هەموو سایلۆکانی ${p.name}`);
      saveState();
      render();
    }

    function toggleSiloFault(pId, hId) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      h.silo.fault = !h.silo.fault;
      if (h.silo.fault) playAlarmBeep();
      saveState();
      render();
    }

    function setStaffAtt(pId, sId, status) {
      const p = state.projects.find(x => x.id === pId);
      const s = p.staff.find(x => x.id === sId);
      s.status = status;
      addLog(`👤 تۆماری غیابات: ${s.name} (${status}) لە ${p.name}`);
      saveState();
      render();
    }

    function markAllPresent(pId) {
      const p = state.projects.find(x => x.id === pId);
      p.staff.forEach(s => s.status = 'present');
      saveState();
      render();
    }

    function shareStaffReportWhatsApp(pId) {
      const p = state.projects.find(x => x.id === pId);
      const present = p.staff.filter(s => s.status === 'present').length;
      const absents = p.staff.filter(s => s.status === 'absent').map(s => s.name).join('، ') || 'نییە';
      const leaves = p.staff.filter(s => s.status === 'leave').map(s => s.name).join('، ') || 'نییە';
      const text = `📊 ڕاپۆرتی ستافی ${p.name}\n✅ ئامادەبووان: ${present} لە 25\n❌ نەهاتوو (غائب): ${absents}\n🕒 مۆڵەت: ${leaves}`;
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    let editingStaffCtx = null;
    function openStaffModal(pId, sId) {
      const p = state.projects.find(x => x.id === pId);
      const s = p.staff.find(x => x.id === sId);
      editingStaffCtx = { pId, sId };
      document.getElementById('staffNameInp').value = s.name;
      document.getElementById('staffPhoneInp').value = s.phone;
      document.getElementById('staffModal').classList.add('open');
    }

    function closeStaffModal() {
      document.getElementById('staffModal').classList.remove('open');
      editingStaffCtx = null;
    }

    function saveStaffModal() {
      if (!editingStaffCtx) return;
      const p = state.projects.find(x => x.id === editingStaffCtx.pId);
      const s = p.staff.find(x => x.id === editingStaffCtx.sId);
      const newName = document.getElementById('staffNameInp').value.trim();
      if (newName) s.name = newName;
      s.phone = document.getElementById('staffPhoneInp').value.trim();
      addLog(`✏️ گۆڕینی زانیاری کارمەند بۆ: ${s.name}`);
      saveState();
      closeStaffModal();
      render();
    }

    function openFaultsModal() {
      const faults = getAllFaults();
      const box = document.getElementById('faultsListBox');
      if (faults.length === 0) {
        box.innerHTML = `<p style="text-align:center; padding:18px; color:var(--emerald);">هیچ کێشەیەک لە هیچ کام لە ٨ پڕۆژەکەدا نییە!</p>`;
      } else {
        box.innerHTML = faults.map(f => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; background:var(--bg-card); border:1px solid var(--danger); border-radius:10px; margin-bottom:8px;">
            <div>
              <strong>${f.pName}</strong>
              <small style="display:block; color:var(--danger);">${f.text}</small>
            </div>
            <button class="btn btn-primary" onclick="closeFaultsModal(); openProject(${f.pId}, '${f.tab}', ${f.hId || 1});">چوون</button>
          </div>
        `).join('');
      }
      document.getElementById('faultsModal').classList.add('open');
    }

    function closeFaultsModal() {
      document.getElementById('faultsModal').classList.remove('open');
    }

    function fixAllFaults() {
      state.projects.forEach(p => {
        p.shower.fault = false;
        p.generators.forEach(g => g.fault = false);
        p.halls.forEach(h => {
          h.alarms = { temp: false, n2: false, co2: false };
          h.temp = h.targetTemp;
          h.silo.fault = false;
          Object.values(h.groups).forEach(grp => grp.units.forEach(u => {
            if (u.fault) { u.fault = false; u.on = true; }
          }));
        });
      });
      addLog('✅ هەموو ئەلارم و کێشەکانی سیستەم چاککرانەوە.');
      saveState();
      closeFaultsModal();
      render();
    }

    function exportDataJson() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ projects: state.projects, logs: state.logs }));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", "scada_poultry_backup.json");
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importDataJson(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.projects) {
            state.projects = parsed.projects;
            state.logs = parsed.logs || [];
            saveState();
            render();
            alert('داتاکان بە سەرکەوتوویی گەڕێندرانەوە!');
          }
        } catch (err) {
          alert('فایلەکە دروست نییە!');
        }
      };
      reader.readAsText(file);
    }

    function resetAllData() {
      if (confirm('دڵنیایت دەتەوێت هەموو داتاکان بگەڕێنیتەوە سەر دۆخی سەرەتا؟')) {
        localStorage.removeItem(STORAGE_KEY);
        loadState();
        render();
      }
    }

    loadState();
    render();
  </script>
</body>
</html>
