<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>سیستەمی زیرەکی کێڵگەکانی پەلەوەر | Smart SCADA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-body: #090d16;
      --bg-surface: #111827;
      --bg-card: #1e293b;
      --bg-chip: #0f172a;
      --border: rgba(148, 163, 184, 0.16);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #0ea5e9;
      --primary-soft: rgba(14, 165, 233, 0.15);
      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.15);
      --danger: #f43f5e;
      --danger-soft: rgba(244, 63, 94, 0.16);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.16);
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    body.light-mode {
      --bg-body: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-card: #f8fafc;
      --bg-chip: #e2e8f0;
      --border: rgba(15, 23, 42, 0.1);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --shadow: 0 8px 20px -4px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 90px;
      transition: background-color 0.25s, color 0.25s;
    }

    /* هێدەری سەرەوە */
    header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--emerald));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #fff;
      flex-shrink: 0;
    }

    .project-select {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      outline: none;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border);
      height: 38px;
      padding: 0 12px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      transition: 0.2s;
    }

    .icon-btn.alarm-ok {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: var(--emerald);
    }

    .icon-btn.alarm-fault {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
      animation: pulseRed 1.3s infinite;
    }

    @keyframes pulseRed {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 14px;
    }

    /* کارتی کورتەی گشتی */
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .sum-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .sum-box-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--primary-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .sum-box small {
      color: var(--text-muted);
      font-size: 0.75rem;
      display: block;
    }

    .sum-box strong {
      font-size: 1.05rem;
      font-weight: 800;
    }

    /* کارتی پڕۆژەکان لە پەڕەی هۆم */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }

    .p-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .p-card:hover {
      transform: translateY(-3px);
      border-color: var(--primary);
    }

    .p-card.has-fault {
      border-color: var(--danger);
    }

    .mini-halls-dots {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      background: var(--bg-card);
      padding: 10px;
      border-radius: 12px;
    }

    .h-dot {
      height: 26px;
      border-radius: 7px;
      background: var(--emerald-soft);
      border: 1px solid var(--emerald);
      color: var(--emerald);
      font-size: 0.72rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .h-dot.fault {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }

    .p-card-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
    }

    .p-stat-item {
      background: var(--bg-card);
      padding: 8px 6px;
      border-radius: 10px;
      font-size: 0.75rem;
    }

    .p-stat-item span {
      color: var(--text-muted);
      display: block;
      font-size: 0.7rem;
    }

    /* شریتی هەڵبژاردنی ١٠ هۆڵەکە */
    .hall-pills-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .hall-pills-scroll::-webkit-scrollbar { display: none; }

    .hall-pill {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 9px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: 0.2s;
    }

    .hall-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .hall-pill.fault {
      border-color: var(--danger);
      color: var(--danger);
    }

    /* ٣ هەستەوەرەکەی کەشوهەوای هۆڵ */
    .sensors-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .sensor-tile {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
    }

    .sensor-tile.alarm {
      background: var(--danger-soft);
      border-color: var(--danger);
    }

    .sensor-tile .val {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--primary);
      margin: 4px 0;
    }

    .sensor-tile.alarm .val {
      color: var(--danger);
    }

    /* کارتی زیرەکی گرووپی ئامێرەکان (Smart Group Card) */
    .smart-groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 14px;
    }

    .smart-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .smart-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .smart-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .smart-title-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    /* سویچی مۆدێرن (Toggle Switch) */
    .switch-btn {
      padding: 6px 14px;
      border-radius: 50px;
      border: 1px solid var(--border);
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
    }

    .switch-btn.all-on {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #fff;
    }

    .switch-btn.all-off {
      background: var(--bg-card);
      color: var(--text-muted);
    }

    /* دوگمە بچووکەکانی ژمارەی ئامێرەکان (١ تا ١٤) */
    .unit-chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .unit-chip {
      min-width: 42px;
      height: 38px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-chip);
      color: var(--text-muted);
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: 0.15s;
      user-select: none;
    }

    .unit-chip.on {
      background: var(--emerald-soft);
      border-color: var(--emerald);
      color: var(--emerald);
    }

    .unit-chip.fault {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
      animation: pulseRed 1s infinite;
    }

    .card-hint {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }

    /* سایلۆکان */
    .silos-compact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 12px;
    }

    .silo-mini-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .silo-bar-wrap {
      height: 14px;
      background: var(--bg-chip);
      border-radius: 50px;
      overflow: hidden;
      margin: 10px 0;
      border: 1px solid var(--border);
    }

    .silo-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #10b981);
      transition: width 0.3s;
    }

    /* کارتی کارمەندان بۆ مۆبایل */
    .staff-search-bar {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 0.9rem;
      margin-bottom: 12px;
      outline: none;
    }

    .staff-cards-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px;
    }

    .staff-item-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .staff-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .att-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .att-pill {
      padding: 7px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .att-pill.present.active { background: var(--emerald-soft); border-color: var(--emerald); color: var(--emerald); }
    .att-pill.absent.active { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
    .att-pill.leave.active { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }

    /* مێنوی خوارەوەی مۆبایل (Bottom Bar) */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-surface);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px;
      z-index: 150;
      box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.25);
    }

    .nav-item {
      background: transparent;
      border: none;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 12px;
      transition: 0.2s;
    }

    .nav-item .nav-icon {
      font-size: 1.25rem;
    }

    .nav-item.active {
      color: var(--primary);
      background: var(--primary-soft);
    }

    /* مۆداڵ */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 250;
      padding: 16px;
    }
    .modal-bg.open { display: flex; }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      max-height: 82vh;
      overflow-y: auto;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      margin-top: 6px;
      margin-bottom: 14px;
      font-size: 0.9rem;
    }

    @media (max-width: 500px) {
      .sensors-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- هێدەری سەرەوە -->
  <header>
    <div class="header-right">
      <div class="app-logo" onclick="goHome()" style="cursor:pointer;">🐔</div>
      <select id="projectSelectDropdown" class="project-select" onchange="handleProjectDropdown(this.value)"></select>
    </div>

    <div class="header-left">
      <button id="globalAlarmBtn" class="icon-btn alarm-ok" onclick="openFaultsModal()">
        <span id="globalAlarmCount">٠ کێشە</span>
      </button>
      <button class="icon-btn" onclick="toggleFaultMode()" id="faultModeBtn" title="تاقیکردنەوەی دروستکردنی ئەلارم">
        🔧 تاقیکردنەوە
      </button>
      <button class="icon-btn" onclick="toggleTheme()" id="themeBtn" title="گۆڕینی ڕووناکی شاشە">☀️</button>
    </div>
  </header>

  <!-- ناوەڕۆکی سەرەکی -->
  <main id="appContainer"></main>

  <!-- مێنوی خوارەوەی مۆبایل -->
  <nav class="bottom-nav">
    <button class="nav-item" id="nav-home" onclick="goHome()">
      <span class="nav-icon">🏠</span>
      <span>هەموو پڕۆژەکان</span>
    </button>
    <button class="nav-item" id="nav-halls" onclick="switchTab('halls')">
      <span class="nav-icon">🎛️</span>
      <span>١٠ هۆڵەکە</span>
    </button>
    <button class="nav-item" id="nav-power" onclick="switchTab('power')">
      <span class="nav-icon">⚡</span>
      <span>مۆلیدە و تەعقیم</span>
    </button>
    <button class="nav-item" id="nav-silos" onclick="switchTab('silos')">
      <span class="nav-icon">🌾</span>
      <span>١٠ سایلۆکە</span>
    </button>
    <button class="nav-item" id="nav-staff" onclick="switchTab('staff')">
      <span class="nav-icon">👥</span>
      <span>ستاف (٢٥)</span>
    </button>
  </nav>

  <!-- مۆداڵی دەستکاری ناوی کارمەند -->
  <div class="modal-bg" id="staffModal">
    <div class="modal-box">
      <h3 style="margin-bottom:14px;">✏️ گۆڕینی ناوی کارمەند</h3>
      <label style="font-size:0.8rem; color:var(--text-muted);">ناوی سیانی:</label>
      <input type="text" id="staffNameInput" class="form-input" />
      <label style="font-size:0.8rem; color:var(--text-muted);">ژمارەی مۆبایل:</label>
      <input type="text" id="staffPhoneInput" class="form-input" />
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button class="icon-btn" onclick="closeStaffModal()">پاشگەزبوونەوە</button>
        <button class="icon-btn" style="background:var(--primary); color:#fff;" onclick="saveStaffModal()">پاشەکەوتکردن</button>
      </div>
    </div>
  </div>

  <!-- مۆداڵی لیستی ئەلارمەکان -->
  <div class="modal-bg" id="faultsModal">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h3>🚨 کێشە و ئەلارمە چالاکەکان</h3>
        <button class="icon-btn alarm-ok" onclick="fixAllFaults()">چاککردنی هەمووی</button>
      </div>
      <div id="faultsModalContent"></div>
      <div style="display:flex; justify-content:flex-end; margin-top:14px;">
        <button class="icon-btn" onclick="closeFaultsModal()">داخستن</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'SMART_SCADA_V3';

    const FIRST_NAMES = ['کاروان','بەرهەم','سۆران','ئارام','دیار','هەڵۆ','ڕێبین','شوان','پشتیوان','زانا','هێمن','ئومێد','شاهین','بەختیار','کاردۆ','سەنگەر','نەبەز','ڕزگار','هاوکار','دلێر','کامەران','گۆران','سامان','یاسین','فەرهاد'];
    const LAST_NAMES = ['ئەحمەد','محەمەد','عەلی','حەسەن','ئیبراهیم','مەحموود','عوسمان','قادر','کەریم','سەعید','مستەفا','عەبدوڵڵا'];

    function createStaff(pIdx) {
      const roles = [
        'ئەندازیاری ئۆتۆمەیشن', 'دکتۆری پەلەوەر', 'سەرپەرشتیاری گشتی',
        'وەستای کارەبا', 'وەستای میکانیک', 'پاسەوان', 'چێشتلێنەر'
      ];
      for (let i = 1; i <= 18; i++) roles.push(`کرێکاری هۆڵ (${i})`);

      return roles.map((role, idx) => ({
        id: `P${pIdx}_S${idx+1}`,
        name: `${FIRST_NAMES[(idx + pIdx*2) % FIRST_NAMES.length]} ${LAST_NAMES[(idx + pIdx) % LAST_NAMES.length]}`,
        role,
        phone: `0750 ${110 + pIdx}${210 + idx}`,
        status: 'present'
      }));
    }

    function makeUnits(count, defaultOn = true) {
      return Array.from({ length: count }, (_, i) => ({ num: i + 1, on: defaultOn, fault: false }));
    }

    function createHall(hIdx) {
      return {
        id: hIdx,
        name: `هۆڵی ${hIdx}`,
        temp: +(24.5 + (hIdx % 3) * 0.4).toFixed(1),
        n2: 12 + (hIdx % 4),
        co2: 1850 + hIdx * 25,
        alarms: { temp: false, n2: false, co2: false },
        silo: { tons: +(19.5 - (hIdx % 5) * 2).toFixed(1), max: 25, augerOn: true, fault: false },
        groups: {
          elecPanels: { title: 'لوحەی کارەبای مەرکەزی', icon: '⚡', label: 'لوحە', units: makeUnits(2, true) },
          exhaustFans: { title: 'ساحیبەکانی هەواگۆڕکێ', icon: '🌀', label: 'ساحیبە', units: makeUnits(14, true) },
          tunnelFans: { title: 'ساحیبەی تونێل (ساردی و گەرمی)', icon: '🌬️', label: 'تونێل', units: makeUnits(2, true) },
          heaters: { title: 'هیتەرەکانی گەرمکەرەوە', icon: '🔥', label: 'هیتەر', units: makeUnits(6, false) },
          coolingMotors: { title: 'ماتۆڕی شەلالی ساردکەرەوە', icon: '💧', label: 'شەلال', units: makeUnits(4, true) },
          ventWindows: { title: 'پەنجەرەی تەهویە (ڕاست و چەپ)', icon: '🪟', label: 'پەنجەرە', units: makeUnits(2, true) },
          feedLines: { title: 'هێڵی دانخۆری ئۆتۆماتیکی', icon: '🌾', label: 'هێڵی عەلەف', units: makeUnits(6, true) },
          lightLines: { title: 'هێڵی ڕووناکی ناوەوە', icon: '💡', label: 'ڕووناکی', units: makeUnits(6, true) }
        }
      };
    }

    function buildInitialProjects() {
      return Array.from({ length: 8 }, (_, p) => ({
        id: p + 1,
        name: `پڕۆژەی دەواجنی (${p + 1})`,
        shower: { on: true, level: 92, entries: 18 + p, fault: false },
        generators: [
          { id: 1, name: 'مۆلیدەی سەرەکی (1) - 500 kVA', on: true, fuel: 86, fault: false },
          { id: 2, name: 'مۆلیدەی یەدەگ (2) - 500 kVA', on: false, fuel: 95, fault: false }
        ],
        halls: Array.from({ length: 10 }, (_, h) => createHall(h + 1)),
        staff: createStaff(p + 1)
      }));
    }

    let state = {
      view: 'home', // 'home' | 'halls' | 'power' | 'silos' | 'staff'
      projectId: 1,
      hallId: 1,
      faultSimMode: false,
      staffSearch: '',
      lightMode: false,
      projects: []
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        state.projects = raw ? JSON.parse(raw) : buildInitialProjects();
      } catch (e) {
        state.projects = buildInitialProjects();
      }
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.projects)); } catch (e) {}
    }

    function getAllFaults() {
      const list = [];
      state.projects.forEach(p => {
        if (p.shower.fault) list.push({ pId: p.id, pName: p.name, tab: 'power', text: 'حەمامی تەعقیم' });
        p.generators.forEach(g => {
          if (g.fault) list.push({ pId: p.id, pName: p.name, tab: 'power', text: g.name });
        });
        p.halls.forEach(h => {
          if (h.alarms.temp) list.push({ pId: p.id, pName: p.name, hId: h.id, tab: 'halls', text: `${h.name}: ئەلارمی پلەی گەرمی` });
          if (h.alarms.n2) list.push({ pId: p.id, pName: p.name, hId: h.id, tab: 'halls', text: `${h.name}: بەرزی گازی N2` });
          if (h.alarms.co2) list.push({ pId: p.id, pName: p.name, hId: h.id, tab: 'halls', text: `${h.name}: بەرزی گازی CO2` });
          if (h.silo.fault) list.push({ pId: p.id, pName: p.name, hId: h.id, tab: 'silos', text: `سایلۆی ${h.name}` });
          Object.values(h.groups).forEach(grp => {
            grp.units.forEach(u => {
              if (u.fault) list.push({ pId: p.id, pName: p.name, hId: h.id, tab: 'halls', text: `${h.name} - ${grp.label} ژمارە ${u.num}` });
            });
          });
        });
      });
      return list;
    }

    function countHallFaults(h) {
      let c = (h.alarms.temp ? 1 : 0) + (h.alarms.n2 ? 1 : 0) + (h.alarms.co2 ? 1 : 0) + (h.silo.fault ? 1 : 0);
      Object.values(h.groups).forEach(g => g.units.forEach(u => { if (u.fault) c++; }));
      return c;
    }

    function countProjectFaults(p) {
      let c = (p.shower.fault ? 1 : 0) + p.generators.filter(g => g.fault).length;
      p.halls.forEach(h => { c += countHallFaults(h); });
      return c;
    }

    function toggleTheme() {
      state.lightMode = !state.lightMode;
      document.body.classList.toggle('light-mode', state.lightMode);
      document.getElementById('themeBtn').textContent = state.lightMode ? '🌙' : '☀️';
    }

    function toggleFaultMode() {
      state.faultSimMode = !state.faultSimMode;
      const btn = document.getElementById('faultModeBtn');
      btn.style.background = state.faultSimMode ? 'var(--amber)' : '';
      btn.style.color = state.faultSimMode ? '#000' : '';
      render();
    }

    function handleProjectDropdown(val) {
      if (val === 'home') {
        goHome();
      } else {
        state.projectId = parseInt(val, 10);
        if (state.view === 'home') state.view = 'halls';
        render();
      }
    }

    function goHome() {
      state.view = 'home';
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openProject(pId, tab = 'halls', hId = 1) {
      state.projectId = pId;
      state.view = tab;
      state.hallId = hId;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchTab(tab) {
      state.view = tab;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateBars() {
      // Dropdown
      const sel = document.getElementById('projectSelectDropdown');
      sel.innerHTML = `<option value="home" ${state.view === 'home' ? 'selected' : ''}>🏠 هەموو پڕۆژەکان (٨ پڕۆژە)</option>` +
        state.projects.map(p => `<option value="${p.id}" ${state.view !== 'home' && state.projectId === p.id ? 'selected' : ''}>📍 ${p.name}</option>`).join('');

      // Alarm Button
      const faults = getAllFaults();
      const alarmBtn = document.getElementById('globalAlarmBtn');
      const alarmTxt = document.getElementById('globalAlarmCount');
      if (faults.length === 0) {
        alarmBtn.className = 'icon-btn alarm-ok';
        alarmTxt.textContent = '✅ بێ کێشە';
      } else {
        alarmBtn.className = 'icon-btn alarm-fault';
        alarmTxt.textContent = `🚨 ${faults.length} کێشە`;
      }

      // Bottom Nav Active
      ['home', 'halls', 'power', 'silos', 'staff'].forEach(k => {
        const el = document.getElementById(`nav-${k}`);
        if (el) el.classList.toggle('active', state.view === k);
      });
    }

    function render() {
      updateBars();
      const box = document.getElementById('appContainer');
      const project = state.projects.find(p => p.id === state.projectId);

      if (state.view === 'home') box.innerHTML = renderHome();
      else if (state.view === 'halls') box.innerHTML = renderHalls(project);
      else if (state.view === 'power') box.innerHTML = renderPower(project);
      else if (state.view === 'silos') box.innerHTML = renderSilos(project);
      else if (state.view === 'staff') box.innerHTML = renderStaff(project);
    }

    function renderHome() {
      const faultsCount = getAllFaults().length;
      const totalStaff = state.projects.reduce((s, p) => s + p.staff.filter(x => x.status === 'present').length, 0);
      const totalTons = state.projects.reduce((s, p) => s + p.halls.reduce((a, h) => a + h.silo.tons, 0), 0).toFixed(0);

      const cards = state.projects.map(p => {
        const pf = countProjectFaults(p);
        const present = p.staff.filter(s => s.status === 'present').length;
        const tons = p.halls.reduce((a, h) => a + h.silo.tons, 0).toFixed(0);
        const dots = p.halls.map(h => {
          const hf = countHallFaults(h);
          return `<div class="h-dot ${hf > 0 ? 'fault' : ''}">H${h.id}</div>`;
        }).join('');

        return `
          <div class="p-card ${pf > 0 ? 'has-fault' : ''}" onclick="openProject(${p.id}, 'halls', 1)">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <strong style="font-size:1.05rem;">${p.name}</strong>
              <span style="font-size:0.78rem; font-weight:800; color:${pf > 0 ? 'var(--danger)' : 'var(--emerald)'}">
                ${pf > 0 ? `⚠️ ${pf} کێشە` : '🟢 ئاسایی'}
              </span>
            </div>
            <div class="mini-halls-dots">${dots}</div>
            <div class="p-card-stats">
              <div class="p-stat-item"><span>ستافی ئامادە</span><strong>${present}/25</strong></div>
              <div class="p-stat-item"><span>کۆی عەلەف</span><strong>${tons} تەن</strong></div>
              <div class="p-stat-item"><span>مۆلیدە</span><strong>${p.generators.filter(g=>g.on).length}/2 کارا</strong></div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="summary-strip">
          <div class="sum-box">
            <div class="sum-box-icon">🏭</div>
            <div><small>کۆی پڕۆژە و هۆڵ</small><strong>٨ پڕۆژە (٨٠ هۆڵ)</strong></div>
          </div>
          <div class="sum-box">
            <div class="sum-box-icon">🌾</div>
            <div><small>کۆی عەلەفی سایلۆکان</small><strong>${totalTons} تەن</strong></div>
          </div>
          <div class="sum-box">
            <div class="sum-box-icon">👷</div>
            <div><small>ستافی ئامادەبوو</small><strong>${totalStaff} لە ٢٠٠ کەس</strong></div>
          </div>
          <div class="sum-box">
            <div class="sum-box-icon">${faultsCount === 0 ? '✅' : '🚨'}</div>
            <div><small>دۆخی گشتی سیستەم</small><strong>${faultsCount === 0 ? 'بێ کێشە' : faultsCount + ' ئەلارم'}</strong></div>
          </div>
        </div>
        <div class="projects-grid">${cards}</div>
      `;
    }

    function renderHalls(project) {
      const hall = project.halls.find(h => h.id === state.hallId) || project.halls[0];

      const hallPills = project.halls.map(h => {
        const hf = countHallFaults(h);
        return `
          <button class="hall-pill ${h.id === hall.id ? 'active' : ''} ${hf > 0 ? 'fault' : ''}" onclick="state.hallId=${h.id}; render();">
            <span>${h.name}</span>
            <span>${hf > 0 ? '🔴' : '🟢'}</span>
          </button>
        `;
      }).join('');

      const groupsHtml = Object.entries(hall.groups).map(([gKey, grp]) => {
        const activeCount = grp.units.filter(u => u.on && !u.fault).length;
        const allOn = activeCount === grp.units.length;

        const chips = grp.units.map(u => `
          <button class="unit-chip ${u.fault ? 'fault' : (u.on ? 'on' : '')}"
                  onclick="handleUnitClick(${project.id}, ${hall.id}, '${gKey}', ${u.num})">
            ${u.num}
          </button>
        `).join('');

        return `
          <div class="smart-card">
            <div class="smart-card-head">
              <div class="smart-title">
                <div class="smart-title-icon">${grp.icon}</div>
                <div>
                  <strong style="font-size:0.95rem; display:block;">${grp.title}</strong>
                  <small style="color:var(--text-muted); font-size:0.75rem;">چالاک: ${activeCount} لە ${grp.units.length}</small>
                </div>
              </div>
              <button class="switch-btn ${allOn ? 'all-on' : 'all-off'}"
                      onclick="toggleEntireGroup(${project.id}, ${hall.id}, '${gKey}', ${!allOn})">
                ${allOn ? 'هەمووی ON' : 'هەمووی OFF'}
              </button>
            </div>
            <div class="unit-chips-wrap">${chips}</div>
            <div class="card-hint">
              <span>${state.faultSimMode ? '🔧 دۆخی تاقیکردنەوە: کلیک لە ژمارەیەک بکە بۆ دروستکردنی کێشە' : '💡 پەنجە بنێ بە هەر ژمارەیەکدا بۆ ON / OFF'}</span>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="hall-pills-scroll">${hallPills}</div>

        <!-- هەستەوەرەکانی ژینگە -->
        <div class="sensors-row">
          <div class="sensor-tile ${hall.alarms.temp ? 'alarm' : ''}" onclick="toggleSensorAlarm(${project.id}, ${hall.id}, 'temp')">
            <small style="color:var(--text-muted);">🌡️ پلەی گەرمی (${hall.name})</small>
            <div class="val">${hall.temp}°C</div>
            <small>${hall.alarms.temp ? '⚠️ ئەلارمی گەرمی/ساردی!' : '🟢 ئاساییە (کلیک بۆ تاقیکردنەوە)'}</small>
          </div>
          <div class="sensor-tile ${hall.alarms.n2 ? 'alarm' : ''}" onclick="toggleSensorAlarm(${project.id}, ${hall.id}, 'n2')">
            <small style="color:var(--text-muted);">🧪 نایترۆجین / ئەمۆنیا (N2)</small>
            <div class="val">${hall.n2} PPM</div>
            <small>${hall.alarms.n2 ? '⚠️ ڕێژەی گاز بەرزە!' : '🟢 هەوا پاکە'}</small>
          </div>
          <div class="sensor-tile ${hall.alarms.co2 ? 'alarm' : ''}" onclick="toggleSensorAlarm(${project.id}, ${hall.id}, 'co2')">
            <small style="color:var(--text-muted);">☁️ دووانەئۆکسید (CO2)</small>
            <div class="val">${hall.co2} PPM</div>
            <small>${hall.alarms.co2 ? '⚠️ پێویستی بە هەواگۆڕکێیە!' : '🟢 ئاساییە'}</small>
          </div>
        </div>

        <div class="smart-groups-grid">${groupsHtml}</div>
      `;
    }

    function renderPower(project) {
      const sh = project.shower;
      const gens = project.generators.map((g, idx) => `
        <div class="smart-card">
          <div class="smart-card-head">
            <div class="smart-title">
              <div class="smart-title-icon">⚡</div>
              <div>
                <strong>${g.name}</strong>
                <small style="display:block; color:var(--text-muted);">گازوایل: ${g.fuel}% • دۆخ: ${g.fault ? '⚠️ کێشە' : (g.on ? 'لە کاردایە' : 'کوژاوە')}</small>
              </div>
            </div>
            <button class="switch-btn ${g.on ? 'all-on' : 'all-off'}" onclick="toggleGen(${project.id}, ${idx})">
              ${g.on ? 'ON' : 'OFF'}
            </button>
          </div>
          <button class="icon-btn ${g.fault ? 'alarm-fault' : ''}" onclick="toggleGenFault(${project.id}, ${idx})">
            ${g.fault ? '🔧 چاککردنەوەی کێشەی مۆلیدە' : '⚡ تاقیکردنەوەی ئەلارمی مۆلیدە'}
          </button>
        </div>
      `).join('');

      return `
        <div class="smart-groups-grid">
          ${gens}
          <div class="smart-card">
            <div class="smart-card-head">
              <div class="smart-title">
                <div class="smart-title-icon">🚿</div>
                <div>
                  <strong>حەمامی تەعقیمی دەرگای سەرەکی</strong>
                  <small style="display:block; color:var(--text-muted);">ماددەی تەعقیم: ${sh.level}% • هاتنەژوورەوەی ئەمڕۆ: ${sh.entries} کەس</small>
                </div>
              </div>
              <button class="switch-btn ${sh.on ? 'all-on' : 'all-off'}" onclick="project.shower.on=!project.shower.on; saveState(); render();">
                ${sh.on ? 'ON' : 'OFF'}
              </button>
            </div>
            <button class="icon-btn ${sh.fault ? 'alarm-fault' : ''}" onclick="project.shower.fault=!project.shower.fault; saveState(); render();">
              ${sh.fault ? '🔧 چاککردنەوەی حەمامی تەعقیم' : '⚡ تاقیکردنەوەی ئەلارمی تەعقیم'}
            </button>
          </div>
        </div>
      `;
    }

    function renderSilos(project) {
      const cards = project.halls.map(h => {
        const s = h.silo;
        const pct = Math.round((s.tons / s.max) * 100);
        return `
          <div class="silo-mini-card" style="border-color:${s.fault ? 'var(--danger)' : ''}">
            <div style="display:flex; justify-content:space-between; font-size:0.85rem;">
              <strong>سایلۆی ${h.name}</strong>
              <span>${s.fault ? '🔴' : '🟢'}</span>
            </div>
            <div class="silo-bar-wrap">
              <div class="silo-bar-fill" style="width:${pct}%"></div>
            </div>
            <div style="font-size:0.95rem; font-weight:800; margin-bottom:10px;">${s.tons} / ${s.max} تەن (${pct}%)</div>
            <div style="display:flex; gap:6px;">
              <button class="icon-btn" style="flex:1;" onclick="refillSilo(${project.id}, ${h.id})">➕ پڕکردنەوە</button>
              <button class="icon-btn ${s.fault ? 'alarm-fault' : ''}" onclick="toggleSiloFault(${project.id}, ${h.id})">⚠️</button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
          <h3>🌾 سایلۆکانی عەلەف (${project.name})</h3>
          <button class="icon-btn" style="background:var(--primary); color:#fff;" onclick="refillAllSilos(${project.id})">➕ پڕکردنەوەی هەمووی</button>
        </div>
        <div class="silos-compact-grid">${cards}</div>
      `;
    }

    function renderStaff(project) {
      const present = project.staff.filter(s => s.status === 'present').length;
      const absent = project.staff.filter(s => s.status === 'absent').length;
      const filtered = project.staff.filter(s => s.name.includes(state.staffSearch) || s.role.includes(state.staffSearch));

      const list = filtered.map((s, idx) => `
        <div class="staff-item-card">
          <div class="staff-top">
            <div>
              <strong style="font-size:0.95rem;">${idx + 1}. ${s.name}</strong>
              <small style="display:block; color:var(--primary); font-weight:700;">${s.role} • ${s.phone}</small>
            </div>
            <button class="icon-btn" onclick="openStaffModal(${project.id}, '${s.id}')">✏️ ناو</button>
          </div>
          <div class="att-group">
            <button class="att-pill present ${s.status === 'present' ? 'active' : ''}" onclick="setStaffAtt(${project.id}, '${s.id}', 'present')">✅ ئامادە</button>
            <button class="att-pill absent ${s.status === 'absent' ? 'active' : ''}" onclick="setStaffAtt(${project.id}, '${s.id}', 'absent')">❌ غائب</button>
            <button class="att-pill leave ${s.status === 'leave' ? 'active' : ''}" onclick="setStaffAtt(${project.id}, '${s.id}', 'leave')">🕒 مۆڵەت</button>
          </div>
        </div>
      `).join('');

      return `
        <div style="display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;">
          <span class="icon-btn alarm-ok">✅ ئامادە: ${present}</span>
          <span class="icon-btn alarm-fault" style="animation:none;">❌ غائب: ${absent}</span>
          <button class="icon-btn" style="margin-right:auto;" onclick="markAllPresent(${project.id})">هەمووی ئامادەبوو</button>
        </div>
        <input type="text" class="staff-search-bar" placeholder="🔍 گەڕان بەدوای ناوی کارمەند یان پیشە..."
               value="${state.staffSearch}" oninput="state.staffSearch=this.value; render();" />
        <div class="staff-cards-list">${list}</div>
      `;
    }

    // کردارەکان
    function handleUnitClick(pId, hId, gKey, unitNum) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      const u = h.groups[gKey].units.find(x => x.num === unitNum);

      if (state.faultSimMode || u.fault) {
        u.fault = !u.fault;
        if (u.fault) u.on = false;
      } else {
        u.on = !u.on;
      }
      saveState();
      render();
    }

    function toggleEntireGroup(pId, hId, gKey, targetOn) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      h.groups[gKey].units.forEach(u => {
        if (!u.fault) u.on = targetOn;
      });
      saveState();
      render();
    }

    function toggleSensorAlarm(pId, hId, key) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      h.alarms[key] = !h.alarms[key];
      if (key === 'temp') h.temp = h.alarms.temp ? 34.5 : 24.8;
      if (key === 'n2') h.n2 = h.alarms.n2 ? 48 : 13;
      if (key === 'co2') h.co2 = h.alarms.co2 ? 4200 : 1900;
      saveState();
      render();
    }

    function toggleGen(pId, idx) {
      const p = state.projects.find(x => x.id === pId);
      p.generators[idx].on = !p.generators[idx].on;
      saveState();
      render();
    }

    function toggleGenFault(pId, idx) {
      const p = state.projects.find(x => x.id === pId);
      p.generators[idx].fault = !p.generators[idx].fault;
      if (p.generators[idx].fault) p.generators[idx].on = false;
      saveState();
      render();
    }

    function refillSilo(pId, hId) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      h.silo.tons = h.silo.max;
      h.silo.fault = false;
      saveState();
      render();
    }

    function refillAllSilos(pId) {
      const p = state.projects.find(x => x.id === pId);
      p.halls.forEach(h => { h.silo.tons = h.silo.max; h.silo.fault = false; });
      saveState();
      render();
    }

    function toggleSiloFault(pId, hId) {
      const p = state.projects.find(x => x.id === pId);
      const h = p.halls.find(x => x.id === hId);
      h.silo.fault = !h.silo.fault;
      saveState();
      render();
    }

    function setStaffAtt(pId, sId, status) {
      const p = state.projects.find(x => x.id === pId);
      const s = p.staff.find(x => x.id === sId);
      s.status = status;
      saveState();
      render();
    }

    function markAllPresent(pId) {
      const p = state.projects.find(x => x.id === pId);
      p.staff.forEach(s => s.status = 'present');
      saveState();
      render();
    }

    let editingStaff = null;
    function openStaffModal(pId, sId) {
      const p = state.projects.find(x => x.id === pId);
      const s = p.staff.find(x => x.id === sId);
      editingStaff = { pId, sId };
      document.getElementById('staffNameInput').value = s.name;
      document.getElementById('staffPhoneInput').value = s.phone;
      document.getElementById('staffModal').classList.add('open');
    }

    function closeStaffModal() {
      document.getElementById('staffModal').classList.remove('open');
      editingStaff = null;
    }

    function saveStaffModal() {
      if (!editingStaff) return;
      const p = state.projects.find(x => x.id === editingStaff.pId);
      const s = p.staff.find(x => x.id === editingStaff.sId);
      const newName = document.getElementById('staffNameInput').value.trim();
      if (newName) s.name = newName;
      s.phone = document.getElementById('staffPhoneInput').value.trim();
      saveState();
      closeStaffModal();
      render();
    }

    function openFaultsModal() {
      const faults = getAllFaults();
      const box = document.getElementById('faultsModalContent');
      if (faults.length === 0) {
        box.innerHTML = `<p style="text-align:center; padding:18px; color:var(--emerald);">هیچ کێشەیەک لە سیستەمەکەدا نییە!</p>`;
      } else {
        box.innerHTML = faults.map(f => `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; background:var(--bg-card); border-radius:10px; margin-bottom:8px;">
            <div>
              <strong>${f.pName}</strong>
              <small style="display:block; color:var(--danger);">${f.text}</small>
            </div>
            <button class="icon-btn" onclick="closeFaultsModal(); openProject(${f.pId}, '${f.tab}', ${f.hId || 1});">چوون</button>
          </div>
        `).join('');
      }
      document.getElementById('faultsModal').classList.add('open');
    }

    function closeFaultsModal() {
      document.getElementById('faultsModal').classList.remove('open');
    }

    function fixAllFaults() {
      state.projects.forEach(p => {
        p.shower.fault = false;
        p.generators.forEach(g => g.fault = false);
        p.halls.forEach(h => {
          h.alarms = { temp: false, n2: false, co2: false };
          h.silo.fault = false;
          Object.values(h.groups).forEach(grp => grp.units.forEach(u => {
            if (u.fault) { u.fault = false; u.on = true; }
          }));
        });
      });
      saveState();
      closeFaultsModal();
      render();
    }

    loadState();
    render();
  </script>
</body>
</html>
